<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - INTI Facility Management System</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

  <header class="topbar">
    <h2>INTI Facility Management System</h2>
    <span class="help-icon">
    ?
    <!-- The text shown when hover to the "?" -->
    <span class="help-tooltip">
      Fill in your information and wait for admin approval to access the system.
    </span>
    </span>
  </header>

  <main class="login-hero">
    <!-- ADDED 'register-card' CLASS HERE TO ISOLATE STYLES -->
    <div class="login-card register-card">
      <div style="text-align:center; margin-bottom: 24px;">
        <h1 style="font-size:28px; font-weight:800; color:#111827; margin:0 0 6px;">Register Account</h1>
        <p style="font-size:14px; color:#6b7280; font-weight:500; margin:0;">Submit your details for admin approval</p>
      </div>

      <!-- Full Name -->
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Enter full name">

      <!-- User ID -->
      <label>Student ID / Staff ID</label>
      <input type="text" id="userId" placeholder="Enter Student ID or Staff ID">

      <!-- Email -->
      <label>Institutional Email</label>
      <input type="email" id="email" placeholder="Enter institutional email" oninput="checkRoleRestriction()">

      <!-- Role Dropdown -->
      <label>Role</label>
      <select id="role">
        <option value="">-- Select Role --</option>
        <option value="student" id="opt-student">Student</option>
        <option value="staff" id="opt-staff">Staff</option>
      </select>

      <button style="margin-top: 10px;" onclick="register()">Submit Registration</button>

      <div style="text-align:center; margin-top: 20px;">
        <p style="font-size:13px; color:#6b7280; margin:0;">
          Already registered? 
          <a href="login.html" style="color:#D12E26; font-weight:600; text-decoration:none;">Sign in</a>
        </p>
      </div>

      <p id="message" style="margin-top: 20px; text-align:center;"></p>
    </div>
  </main>

  <script>
    // Automatically restricts the role to "Student" if the email contains "student"
    function checkRoleRestriction() {
      const email = document.getElementById("email").value.toLowerCase();
      const roleSelect = document.getElementById("role");
      const staffOption = document.getElementById("opt-staff");

      if (email.includes("student")) {
        roleSelect.value = "student";
        staffOption.disabled = true; // Lock staff option
      } else {
        staffOption.disabled = false; // Enable staff option if "student" is not in email
      }
    }

    // Handles submitting registration data to backend
    function register() {
      const name = document.getElementById("name").value.trim();
      const userId = document.getElementById("userId").value.trim();
      const email = document.getElementById("email").value.trim();
      const role = document.getElementById("role").value;
      const message = document.getElementById("message");

      message.innerText = "";

      if (!name || !userId || !email || !role) {
        message.style.color = "#D12E26";
        message.innerText = "Please fill in all fields.";
        return;
      }

      fetch("/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, user_id: userId, email, role })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          message.style.color = "#16a34a"; // Green for success
          message.innerText = "Registration successful! Pending admin approval.";
          
          // Clear inputs
          document.getElementById("name").value = "";
          document.getElementById("userId").value = "";
          document.getElementById("email").value = "";
          document.getElementById("role").value = "";
        } else {
          message.style.color = "#D12E26";
          message.innerText = data.message || "Registration failed.";
        }
      })
      .catch(() => {
        message.style.color = "#D12E26";
        message.innerText = "Server connection failed.";
      });
    }
  </script>

</body>
</html>
