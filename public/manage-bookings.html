<!DOCTYPE html>
<html>
<head>
  <title>Manage Bookings - Facility Management System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-body">

  <div id="appHeader"></div>

  <div class="dashboard-layout">

    <div id="appSidebar"></div>

    <main class="main-content">

      <h1 class="page-title">Manage Bookings</h1>

      <p class="page-subtitle">
        View, filter, and modify student and staff reservations campus-wide.
      </p>

      <div class="manage-booking-tabs">
        <button class="booking-tab active" onclick="filterBookings('all', event)">All</button>
        <button class="booking-tab" onclick="filterBookings('pending', event)">Pending Review</button>
        <button class="booking-tab" onclick="filterBookings('active', event)">Active</button>
        <button class="booking-tab" onclick="filterBookings('approved', event)">Approved</button>
        <button class="booking-tab" onclick="filterBookings('cancelled', event)">Cancelled</button>
      </div>

      <div class="booking-toolbar">

        <label>Filter By:</label>

        <div class="date-input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" height="18px" viewBox="0 -960 960 960" width="18px" fill="currentColor">
            <path d="M200-80q-33 0-56.5-23.5T120-160v-560q0-33 23.5-56.5T200-800h40v-80h80v80h320v-80h80v80h40q33 0 56.5 23.5T840-720v560q0 33-23.5 56.5T760-80H200Zm0-80h560v-400H200v400Zm0-480h560v-80H200v80Zm0 0v-80 80Z"/>
          </svg>

          <input type="text" id="filterDate" placeholder="Select Date" readonly>
        </div>

        <div class="custom-dropdown" id="bookingFacilityDropdown">
          <button class="custom-dropdown-btn" type="button" onclick="toggleBookingFacilityDropdown()">
            <span id="bookingFacilityLabel">Facility</span>

            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>

          <div class="custom-dropdown-menu" id="bookingFacilityMenu"></div>
        </div>

        <button class="export-btn" onclick="exportToCSV()">
          <img 
            src="images/download_24dp_6B7280_FILL0_wght400_GRAD0_opsz24.svg" 
            class="export-icon"
            alt="Export icon"
          >
          <span>Export</span>
        </button>

      </div>

      <div class="booking-table-card">

        <table class="manage-booking-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>User</th>
              <th>Room</th>
              <th>Date & Time</th>
              <th>Purpose</th>
              <th>Action</th>
              <th>More</th>
            </tr>
          </thead>

          <tbody id="bookingTable"></tbody>
        </table>

      </div>

      <div class="booking-footer">
        <p id="bookingCount">Showing 0 bookings</p>
      </div>

    </main>

  </div>

  <script src="component.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <script>
    loadLayout("manage-bookings");

    const user =
      JSON.parse(localStorage.getItem("user")) ||
      JSON.parse(sessionStorage.getItem("user"));

    if (!user || user.role !== "admin") {
      window.location.href = "login.html";
    }

    let allBookings = [];
    let currentFilteredBookings = []; // Added to track currently visible data for export
    let currentStatusFilter = "all";

    loadBookings();

    function loadBookings() {
      fetch("/api/admin/bookings")
        .then(res => res.json())
        .then(data => {
          if (!data.success) {
            document.getElementById("bookingTable").innerHTML = `
              <tr>
                <td colspan="7">Failed to load bookings.</td>
              </tr>
            `;
            return;
          }

          allBookings = data.bookings;
          currentFilteredBookings = allBookings; // Initialize current filter list
          loadFacilityFilter();
          renderBookings(allBookings);
        })
        .catch(() => {
          document.getElementById("bookingTable").innerHTML = `
            <tr>
              <td colspan="7">Failed to load bookings.</td>
            </tr>
          `;
        });
    }

    function loadFacilityFilter() {
      const facilityMenu = document.getElementById("bookingFacilityMenu");

      const facilities = [
        ...new Set(allBookings.map(item => item.facility_name))
      ];

      facilityMenu.innerHTML = "";

      facilities.forEach(name => {
        facilityMenu.innerHTML += `
          <label class="dropdown-item">
            <input type="checkbox" value="${name}">
            <span>${name}</span>
          </label>
        `;
      });

      document.querySelectorAll("#bookingFacilityMenu input").forEach(cb => {
        cb.addEventListener("change", function() {
          updateBookingFacilityLabel();
          applyBookingFilters();
        });
      });
    }

    function toggleBookingFacilityDropdown() {
      document.getElementById("bookingFacilityMenu").classList.toggle("open");
      document.querySelector("#bookingFacilityDropdown .custom-dropdown-btn").classList.toggle("active");
    }

    document.addEventListener("click", function(e) {
      const dropdown = document.getElementById("bookingFacilityDropdown");

      if (dropdown && !dropdown.contains(e.target)) {
        document.getElementById("bookingFacilityMenu").classList.remove("open");
        document.querySelector("#bookingFacilityDropdown .custom-dropdown-btn").classList.remove("active");
      }
    });

    function getSelectedBookingFacilities() {
      return [...document.querySelectorAll("#bookingFacilityMenu input:checked")]
        .map(cb => cb.value);
    }

    function updateBookingFacilityLabel() {
      const checked = getSelectedBookingFacilities();

      const label =
        checked.length === 0
          ? "Facility"
          : checked.join(", ");

      document.getElementById("bookingFacilityLabel").textContent =
        label.length > 20 ? label.substring(0, 20) + "..." : label;
    }

    function convertDisplayDateToSQL(dateValue) {
      if (!dateValue) return "";

      const [day, month, year] = dateValue.split("/");
      return `${year}-${month}-${day}`;
    }

    function filterBookings(type, event) {
      currentStatusFilter = type;

      document.querySelectorAll(".booking-tab").forEach(tab => {
        tab.classList.remove("active");
      });

      event.target.classList.add("active");

      applyBookingFilters();
    }

    function applyBookingFilters() {
      const facilityValues = getSelectedBookingFacilities();
      const displayDate = document.getElementById("filterDate").value;
      const dateValue = convertDisplayDateToSQL(displayDate);

      let filtered = [...allBookings];

      if (currentStatusFilter !== "all") {
        filtered = filtered.filter(item => {
          const status = item.booking_status;

          if (currentStatusFilter === "pending") {
            return status === "pending" || status === "pending_payment";
          }

          if (currentStatusFilter === "active") {
            return status === "reserved" || status === "checked_in" || status === "key_collected";
          }

          if (currentStatusFilter === "approved") {
            return status === "approved";
          }

          if (currentStatusFilter === "cancelled") {
            return status === "cancelled";
          }

          return true;
        });
      }

      if (facilityValues.length > 0) {
        filtered = filtered.filter(item =>
          facilityValues.includes(item.facility_name)
        );
      }

      if (dateValue) {
        filtered = filtered.filter(item => {
        return item.booking_date === dateValue;
        });
      }

      currentFilteredBookings = filtered; // Save the newly filtered list for exports
      renderBookings(filtered);
    }

    function renderBookings(bookings) {
      const bookingTable = document.getElementById("bookingTable");
      const bookingCount = document.getElementById("bookingCount");

      bookingTable.innerHTML = "";

      if (bookings.length === 0) {
        bookingTable.innerHTML = `
          <tr>
            <td colspan="7">No bookings found.</td>
          </tr>
        `;

        bookingCount.innerText = "Showing 0 bookings";
        return;
      }

      bookings.forEach(booking => {
        bookingTable.innerHTML += `
          <tr>
            <td>#${String(booking.booking_id).padStart(3, "0")}</td>

            <td>
              <strong>${booking.user_name}</strong>
              <br>
              <span class="booking-role role-${booking.user_role}">
                ${formatRole(booking.user_role)}
              </span>
            </td>

            <td>
              <strong>${booking.facility_name}</strong>
            </td>

            <td class="booking-date-time">
              <span class="booking-date-text">
                ${formatDate(booking.booking_date)}
              </span>

              <span class="booking-time-text">
                ${formatTime(booking.start_time)} - ${formatTime(booking.end_time)}
              </span>
            </td>

            <td>
              <strong>${booking.purpose || "-"}</strong>
            </td>

            <td class="booking-action-icons">
              ${getActionButtons(booking)}
            </td>

            <td>
              <button class="more-btn" onclick="viewBooking(${booking.booking_id})" title="View Details">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor">
                  <path d="M240-400q-33 0-56.5-23.5T160-480q0-33 23.5-56.5T240-560q33 0 56.5 23.5T320-480q0 33-23.5 56.5T240-400Zm240 0q-33 0-56.5-23.5T400-480q0-33 23.5-56.5T480-560q33 0 56.5 23.5T560-480q0 33-23.5 56.5T480-400Zm240 0q-33 0-56.5-23.5T640-480q0-33 23.5-56.5T720-560q33 0 56.5 23.5T800-480q0 33-23.5 56.5T720-400Z"/>
                </svg>
              </button>
        `;
      });

      bookingCount.innerText =
        `Showing 1-${bookings.length} of ${allBookings.length} bookings`;
    }

    function getActionButtons(booking) {
      const status = booking.booking_status;

      if (status === "pending" || status === "pending_payment") {
        return `
        <div class="action-icon-group">
          <button class="approve-icon" title="Approve" onclick="approveBooking(${booking.booking_id})">
            <img 
              src="images/check_24dp_3FB50D_FILL0_wght400_GRAD0_opsz24.svg" 
              class="approve-img"
              alt="Approve"
            >
          </button>

          <button class="reject-icon" title="Cancel" onclick="cancelBooking(${booking.booking_id})">
            <img 
              src="images/close_24dp_3FB50D_FILL0_wght400_GRAD0_opsz24.svg" 
              class="reject-img"
              alt="Cancel"
            >
          </button>
        </div>
      `;
      }

      if (status === "approved") {
        return `<span class="status-active">Approved</span>`;
      }

      if (status === "cancelled") {
        return `<span class="status-inactive">Cancelled</span>`;
      }

      if (status === "completed") {
        return `<span class="status-active">Completed</span>`;
      }

      return `<span>${formatStatus(status)}</span>`;
    }


    function approveBooking(bookingId) {
        if (!confirm("Approve this booking?")) {
            return;
        }

        fetch(`/api/admin/bookings/${bookingId}/approve`, {
            method: "PUT"
        })
        .then(res => res.json())
        .then(data => {
            alert(data.message);
            loadBookings();
        });
        }

    function cancelBooking(bookingId) {
        if (!confirm("Cancel this booking?")) {
            return;
        }

        fetch(`/api/admin/bookings/${bookingId}/cancel`, {
            method: "PUT"
        })
        .then(res => res.json())
        .then(data => {
            alert(data.message);
            loadBookings();
        });
    }

    function viewBooking(id) {
      alert("Booking details page can be connected later. Booking ID: " + id);
    }

    // NEW FUNCTION: Export Data to CSV (Opens in Sheets/Excel)
    function exportToCSV() {
      if (currentFilteredBookings.length === 0) {
        alert("There is no data to export.");
        return;
      }

      // 1. Define Spreadsheet Headers
      let csvContent = "ID,User Name,Role,Facility,Date,Start Time,End Time,Purpose,Status\n";

      // 2. Loop through the currently filtered array and map the values
      currentFilteredBookings.forEach(booking => {
        
        // Helper function to handle commas and text line breaks inside Excel cells properly
        const escapeCSV = (str) => {
          if (str === null || str === undefined) return '""';
          const stringStr = String(str);
          return '"' + stringStr.replace(/"/g, '""') + '"'; 
        };

        const row = [
          escapeCSV(booking.booking_id),
          escapeCSV(booking.user_name),
          escapeCSV(formatRole(booking.user_role)),
          escapeCSV(booking.facility_name),
          escapeCSV(formatDate(booking.booking_date)),
          escapeCSV(formatTime(booking.start_time)),
          escapeCSV(formatTime(booking.end_time)),
          escapeCSV(booking.purpose || "N/A"),
          escapeCSV(formatStatus(booking.booking_status))
        ];

        csvContent += row.join(",") + "\n";
      });

      // 3. Create a downloadable Blob out of the CSV format
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      
      // 4. Trigger standard browser download
      if (link.download !== undefined) {
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        
        // Set dynamic filename based on today's date
        const today = new Date().toISOString().slice(0, 10);
        link.setAttribute("download", `INTI_Bookings_Export_${today}.csv`);
        
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    }

    flatpickr("#filterDate", {
      dateFormat: "d/m/Y",
      disableMobile: true,
      locale: { firstDayOfWeek: 1 },

      onOpen: function(selectedDates, dateStr, instance) {
        setTimeout(function() {
          const cal = instance.calendarContainer;
          const input = document.getElementById("filterDate");
          const rect = input.getBoundingClientRect();

          cal.style.position = "fixed";
          cal.style.top = (rect.bottom + 6) + "px";
          cal.style.left = rect.left + "px";
          cal.style.zIndex = "9999";
        }, 0);
      },

      onReady: function(selectedDates, dateStr, instance) {
        const cal = instance.calendarContainer;
        cal.style.zIndex = "9999";

        const monthsEl = cal.querySelector(".flatpickr-months");
        const prevBtn = cal.querySelector(".flatpickr-prev-month");
        const nextBtn = cal.querySelector(".flatpickr-next-month");

        monthsEl.insertBefore(prevBtn, monthsEl.firstChild);
        monthsEl.appendChild(nextBtn);

        const bottomRow = document.createElement("div");
        bottomRow.className = "fp-bottom-row";

        bottomRow.innerHTML = `
          <button class="fp-cancel-btn" type="button">Cancel</button>
          <button class="fp-apply-btn" type="button">Today</button>
        `;

        cal.appendChild(bottomRow);

        bottomRow.querySelector(".fp-cancel-btn").addEventListener("click", () => {
          instance.clear();
          instance.close();
          applyBookingFilters();
        });

        bottomRow.querySelector(".fp-apply-btn").addEventListener("click", () => {
          instance.setDate(new Date());
          instance.close();
          applyBookingFilters();
        });
      },

      onChange: function() {
        applyBookingFilters();
      }
    });

    window.addEventListener("scroll", function() {
      const fp = document.getElementById("filterDate")._flatpickr;
      if (fp) fp.close();
    }, true);

    function formatRole(role) {
      if (role === "student") return "Student";
      if (role === "staff") return "Staff";
      if (role === "admin") return "Admin";
      return role;
    }

    function formatStatus(status) {
      if (status === "pending") return "Pending Review";
      if (status === "pending_payment") return "Pending Payment";
      if (status === "payment_submitted") return "Payment Submitted";
      if (status === "approved") return "Approved";
      if (status === "reserved") return "Reserved";
      if (status === "checked_in") return "Checked In";
      if (status === "key_collected") return "Key Collected";
      if (status === "completed") return "Completed";
      if (status === "cancelled") return "Cancelled";
      if (status === "expired") return "Expired";
      return status;
    }

    function formatDate(dateValue) {
      const [year, month, day] = dateValue.split("-");
      const date = new Date(year, month - 1, day);
      return date.toLocaleDateString("en-MY", {
          day: "2-digit",
          month: "short",
          year: "numeric"
      });
    }

    function formatTime(time) {
      if (!time) return "-";
      const [hour, minute] = time.split(":");
      let h = parseInt(hour);
      const ampm = h >= 12 ? "PM" : "AM";
      h = h % 12;
      if (h === 0) h = 12;
      return `${h}:${minute} ${ampm}`;
    }

    function logout() {
      localStorage.removeItem("user");
      sessionStorage.removeItem("user");
      window.location.href = "login.html";
    }
  </script>

</body>
</html>
