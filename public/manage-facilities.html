<!DOCTYPE html>
<html>
<head>
  <title>Manage Facilities</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-body">

  <div id="appHeader"></div>

  <div class="dashboard-layout">

    <div id="appSidebar"></div>

    <main class="main-content">

      <div id="facilityListPage">

        <h1 class="page-title">Manage Campus Facilities</h1>
        <p class="page-subtitle">
          View inventory and update room details, capacity, amenities, and status.
        </p>

        <div class="manage-user-toolbar">
          <div class="user-search-box">
            <input 
              type="text" 
              id="facilitySearch" 
              placeholder="Search Rooms..."
              onkeyup="searchFacilities()"
            >
          </div>

          <button class="add-user-btn" onclick="openAddFacility()">
            + Add New Facility
          </button>
        </div>

        <div id="facilityList"></div>

      </div>

      <div id="facilityFormPage" style="display:none;">

        <div class="facility-form-card">

          <h2 id="formTitle" class="facility-selected-title">
            Selected Facility: <span id="facilityNameText">Facility Name</span>
          </h2>
          <hr>

          <div class="facility-photo-row">

          <div id="facilityImageBox" class="facility-image-box">

            <img id="facilityPreview"
                class="facility-edit-image"
                style="display:none;">

            <div id="facilityNoImage" class="facility-empty-state">
              <h3>No Image Uploaded</h3>
              <p>Upload a facility photo to display a preview here.</p>
            </div>

          </div>

          <label class="facility-upload-box">
            <span class="upload-title">Add Photo</span>
            <small class="upload-subtitle">JPG or PNG up to 5MB</small>
            <p class="upload-hint">Click here to upload</p>

            <input type="file" id="imageFile" accept="image/*" onchange="previewImage(event)" hidden>
          </label>

        </div>

          <input type="hidden" id="facility_id">

          <div class="facility-form-grid">

            <div class="facility-full-row">
              <label>Facility Name</label>
              <input type="text" id="facility_name">
            </div>

            <div class="facility-full-row">
              <label>Description</label>
              <input type="text" id="description" placeholder="Enter facility description...">
            </div>

            <div>
              <label>Facility Type</label>

              <select id="facility_type" onchange="toggleOtherFacilityType()">
                <option value="">Select Facility Type</option>
                <option value="Laboratory">Laboratory</option>
                <option value="Sports Facility">Sports Facility</option>
                <option value="Study Space">Study Space</option>
                <option value="Music Facility">Music Facility</option>
                <option value="Meeting Room">Meeting Room</option>
                <option value="Classroom">Classroom</option>
                <option value="Other">Other</option>
              </select>

              <input
                type="text"
                id="other_facility_type"
                placeholder="Enter facility type"
                style="display:none; margin-top:10px;"
              >
            </div>

            <div>
              <label>Booking Flow Type</label>
              <select id="booking_flow_type">
                <option value="normal_approval">Normal Approval</option>
                <option value="payment_required">Payment Required</option>
                <option value="direct_reservation">Direct Reservation</option>
                <option value="staff_key_approval">Staff Key Approval</option>
              </select>
            </div>

            <div>
              <label>Operating Hours</label>
              <div class="time-row">
                <input type="time" id="operating_start">
                <span>to</span>
                <input type="time" id="operating_end">
              </div>
            </div>

            <div id="customTimeSection" style="display:none;">
              <label>Custom Available Time Slots</label>

              <div id="timeSlotContainer"></div>

              <button type="button" onclick="addTimeSlotRow()">
                + Add Time Slot
              </button>
            </div>

            <div>
              <label>Location</label>
              <input type="text" id="location">
            </div>

            <div>
              <label>Max Capacity (Users)</label>
              <input type="number" id="max_people">
            </div>

            <div>
              <label>Operational Status</label>
              <select id="availability_status">
                <option value="available">Available</option>
                <option value="unavailable">Unavailable</option>
                <option value="maintenance">Maintenance</option>
              </select>
            </div>

          </div>

          <div class="facility-textarea-grid">

            <div class="facility-field">
              <label>Facility Rules</label>
              <textarea id="rules" placeholder="Enter facility rules..."></textarea>
            </div>

            <div class="facility-field">
              <label>Additional Information</label>
              <textarea id="additional_info" placeholder="Enter additional information..."></textarea>
            </div>

          </div>

          <div class="facility-form-grid">
            <div>
              <label>Visible To</label>
              <select id="visible_to">
                <option value="student">Student Only</option>
                <option value="staff">Staff Only</option>
                <option value="both">Student & Staff</option>
              </select>
            </div>

            <div>
              <label>Key Required</label>
              <select id="key_required">
                <option value="0">No</option>
                <option value="1">Yes</option>
              </select>
            </div>

            <div>
              <label>Include Equipment / Requirements?</label>
              <select id="equipment_included" onchange="toggleEquipmentOptions()">
                <option value="no">No</option>
                <option value="yes">Yes</option>
              </select>
            </div>
          </div>

          <div id="equipmentOptions" style="display:none;">
          <label>Equipment / Requirements</label>
          <div class="equipment-input-row">
            <input
              type="text"
              id="newEquipment"
              placeholder="Enter equipment or requirement..."
              onkeypress="if(event.key==='Enter'){event.preventDefault();addEquipment();}"
            >
            <button type="button" class="equipment-add-btn" onclick="addEquipment()">
              + Add
            </button>
          </div>
          <div id="equipmentList" class="equipment-tag-list"></div>
        </div>

          <div class="facility-form-actions">
            <button class="back-facility-btn" type="button" onclick="backToFacilityList()">
              Back
            </button>

            <div class="right-action-buttons">
              <button class="delete-facility-btn" id="deleteBtn" type="button" onclick="deleteFacility()">
                Delete Facility
              </button>

              <button class="save-facility-btn" type="button" onclick="saveFacility()">
                Save Changes
              </button>
            </div>

          </div>

          <p id="facilityMessage"></p>

        </div>

      </div>

    </main>

  </div>

  <script src="component.js"></script>

  <script>
    loadLayout("manage-facilities");

    const user =
      JSON.parse(localStorage.getItem("user")) ||
      JSON.parse(sessionStorage.getItem("user"));

    if (!user || user.role !== "admin") {
      window.location.href = "login.html";
    }

    let allFacilities = [];
    let imageBase64 = "";

    loadFacilities();

    function loadFacilities() {
      fetch("/api/facilities", {
        headers: {
          "Authorization": "Bearer " + localStorage.getItem("authToken")
        }
      })
        .then(res => res.json())
        .then(data => {
          if (!data.success) {
            document.getElementById("facilityList").innerHTML = "<p>Failed to load facilities.</p>";
            return;
          }

          allFacilities = data.facilities;
          renderFacilities(allFacilities);
        })
        .catch(() => {
          document.getElementById("facilityList").innerHTML = "<p>Failed to load facilities.</p>";
        });
    }

    function toggleOtherFacilityType() {
      const facilityType = document.getElementById("facility_type").value;
      const otherInput = document.getElementById("other_facility_type");

      if (facilityType === "Other") {
        otherInput.style.display = "block";
      } else {
        otherInput.style.display = "none";
        otherInput.value = "";
      }
    }

    function toggleEquipmentOptions() {
      const equipmentIncluded = document.getElementById("equipment_included").value;
      const equipmentOptions = document.getElementById("equipmentOptions");

      if (equipmentIncluded === "yes") {
        equipmentOptions.style.display = "block";
      } else {
        equipmentOptions.style.display = "none";
        clearEquipmentFields();
      }
    }

    let equipmentItems = [];

    function addEquipment(name = "", checked = true) {

        const input = document.getElementById("newEquipment");
        const equipment = (name || input.value).trim();

        if (!equipment) return;

        if (equipmentItems.includes(equipment)) {
            alert("Equipment already exists.");
            return;
        }

        equipmentItems.push(equipment);
        const container = document.getElementById("equipmentList");
        const label = document.createElement("label");

        label.innerHTML = `
          <span>${equipment}</span>
          <button type="button" onclick="removeEquipment(this, '${equipment}')">×</button>
        `;
        label.className = "equipment-tag";

        container.appendChild(label);
        input.value = "";
    }

    function clearEquipmentFields() {
        equipmentItems = [];
        document.getElementById("newEquipment").value = "";
        document.getElementById("equipmentList").innerHTML = "";
    }

    function renderFacilities(facilities) {
      const facilityList = document.getElementById("facilityList");
      facilityList.innerHTML = "";

      if (facilities.length === 0) {
        facilityList.innerHTML = "<p>No facilities found.</p>";
        return;
      }

      facilities.forEach(facility => {
        facilityList.innerHTML += `
          <div class="admin-facility-card">

            <img 
              src="${facility.image_path || 'images/bg-image-2.jpeg'}" 
              class="admin-facility-img"
            >

            <div class="admin-facility-info">
            <h3>${facility.facility_name}</h3>
            <p class="facility-desc">${facility.description || "No description available"}</p>
            <p class="facility-meta">
              <img src="images/location.svg" width="20" height="20" style="vertical-align: middle; margin-right: 4px;">
              Location: ${facility.location || "-"}
            </p>
            <p class="facility-meta">
              <img src="images/clock.svg" width="20" height="20" style="vertical-align: middle; margin-right: 4px;">
              Time: ${formatTime(facility.operating_start)} - ${formatTime(facility.operating_end)}
            </p>
            <p class="facility-meta">
              <img src="images/flow.svg" width="20" height="20" style="vertical-align: middle; margin-right: 4px;">
              Flow: ${formatBookingFlow(facility.booking_flow_type)}
            </p>
          </div>

            <button class="facility-edit-btn" onclick="editFacility(${facility.facility_id})">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="#D12E26" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            </button>

          </div>
        `;
      });
    }

    function searchFacilities() {
      const searchValue = document.getElementById("facilitySearch").value.toLowerCase();

      const filtered = allFacilities.filter(item =>
        (item.facility_name || "").toLowerCase().includes(searchValue) ||
        (item.location || "").toLowerCase().includes(searchValue) ||
        (item.facility_type || "").toLowerCase().includes(searchValue) ||
        (item.booking_flow_type || "").toLowerCase().includes(searchValue)
      );

      renderFacilities(filtered);
    }

    function openAddFacility() {
      document.getElementById("facilityListPage").style.display = "none";
      document.getElementById("facilityFormPage").style.display = "block";

      document.getElementById("facilityNameText").innerText = "New Facility";
      document.getElementById("deleteBtn").style.display = "none";

      clearFacilityForm();
    }

    function editFacility(id) {
      const facility = allFacilities.find(item => item.facility_id === id);

      if (!facility) {
        alert("Facility not found.");
        return;
      }

      document.getElementById("facilityListPage").style.display = "none";
      document.getElementById("facilityFormPage").style.display = "block";

      document.getElementById("facilityNameText").innerText = facility.facility_name;

      const isCustom = isCustomTimeFacility(facility.facility_name);

      if (isCustom) {
        document.getElementById("customTimeSection").style.display = "block";
        document.getElementById("operating_start").parentElement.style.display = "block";
      } else {
        document.getElementById("customTimeSection").style.display = "none";
        document.getElementById("operating_start").parentElement.style.display = "block";
      }

      document.getElementById("deleteBtn").style.display = "inline-block";

      document.getElementById("facility_id").value = facility.facility_id;
      document.getElementById("facility_name").value = facility.facility_name || "";
      document.getElementById("description").value = facility.description || "";

      setFacilityType(facility.facility_type || "");

      document.getElementById("booking_flow_type").value = facility.booking_flow_type || "normal_approval";
      document.getElementById("operating_start").value = formatInputTime(facility.operating_start);
      document.getElementById("operating_end").value = formatInputTime(facility.operating_end);
      document.getElementById("location").value = facility.location || "";
      document.getElementById("max_people").value = facility.max_people || "";
      document.getElementById("availability_status").value = facility.availability_status || "available";
      document.getElementById("rules").value = facility.rules || "";
      document.getElementById("additional_info").value = facility.additional_info || "";
      document.getElementById("visible_to").value = facility.visible_to || "both";
      document.getElementById("key_required").value = String(facility.key_required || 0);

      if (facility.image_path) {
          document.getElementById("facilityPreview").src = facility.image_path;
          document.getElementById("facilityPreview").style.display = "block";
          document.getElementById("facilityNoImage").style.display = "none";

          imageBase64 = facility.image_path;
      } else {
          document.getElementById("facilityPreview").src = "";
          document.getElementById("facilityPreview").style.display = "none";
          document.getElementById("facilityNoImage").style.display = "flex";

          imageBase64 = "";
      }
      document.getElementById("timeSlotContainer").innerHTML = "";

      if (isCustom && facility.time_slots) {
        const slots = typeof facility.time_slots === "string"
          ? JSON.parse(facility.time_slots)
          : facility.time_slots;

        slots.forEach(s => {
          addTimeSlotRow(s.start, s.end);
        });
      }

      const equipment = facility.equipment || "";

      clearEquipmentFields();
      if (equipment.trim() !== "") {

          document.getElementById("equipment_included").value = "yes";
          document.getElementById("equipmentOptions").style.display = "block";

          equipment.split(",").forEach(item => {
              const text = item.trim();

              if (text !== "") {
                  addEquipment(text, true);
              }
          });
      } else {
          document.getElementById("equipment_included").value = "no";
          document.getElementById("equipmentOptions").style.display = "none";
      }
    }

    function setFacilityType(type) {
      const predefinedTypes = [
        "Laboratory",
        "Sports Facility",
        "Study Space",
        "Music Facility",
        "Meeting Room",
        "Classroom"
      ];

      if (predefinedTypes.includes(type)) {
        document.getElementById("facility_type").value = type;
        document.getElementById("other_facility_type").style.display = "none";
        document.getElementById("other_facility_type").value = "";
      } else if (type) {
        document.getElementById("facility_type").value = "Other";
        document.getElementById("other_facility_type").style.display = "block";
        document.getElementById("other_facility_type").value = type;
      } else {
        document.getElementById("facility_type").value = "";
        document.getElementById("other_facility_type").style.display = "none";
        document.getElementById("other_facility_type").value = "";
      }
    }

    function clearFacilityForm() {
      document.getElementById("facility_id").value = "";
      document.getElementById("facility_name").value = "";
      document.getElementById("description").value = "";
      document.getElementById("facility_type").value = "";
      document.getElementById("other_facility_type").value = "";
      document.getElementById("other_facility_type").style.display = "none";
      document.getElementById("booking_flow_type").value = "normal_approval";
      document.getElementById("operating_start").value = "";
      document.getElementById("operating_end").value = "";
      document.getElementById("timeSlotContainer").innerHTML = "";
      document.getElementById("customTimeSection").style.display = "none";  
      document.getElementById("operating_start").parentElement.style.display = "block";
      document.getElementById("location").value = "";
      document.getElementById("max_people").value = "";
      document.getElementById("availability_status").value = "available";
      document.getElementById("rules").value = "";
      document.getElementById("additional_info").value = "";
      document.getElementById("visible_to").value = "both";
      document.getElementById("key_required").value = "0";

      document.getElementById("equipment_included").value = "no";
      document.getElementById("equipmentOptions").style.display = "none";
      clearEquipmentFields();

      document.getElementById("facilityPreview").style.display = "none";
    document.getElementById("facilityPreview").src = "";
    document.getElementById("facilityNoImage").style.display = "block";
      document.getElementById("facilityMessage").innerText = "";
      imageBase64 = "";
    }

    function previewImage(event) {
    const file = event.target.files[0];

    if (!file) return;

    if (file.size > 5 * 1024 * 1024) {
      alert("Image size must be below 5MB.");
      return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement("canvas");
        const maxWidth = 800;
        let width = img.width;
        let height = img.height;

        if (width > maxWidth) {
          height = Math.round(height * maxWidth / width);
          width = maxWidth;
        }

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        imageBase64 = canvas.toDataURL("image/jpeg", 0.7);
        document.getElementById("facilityPreview").src = imageBase64;
        document.getElementById("facilityPreview").style.display = "block";
        document.getElementById("facilityNoImage").style.display = "none";
      };
      img.src = e.target.result;
    };

    reader.readAsDataURL(file);
  }

    function getEquipmentText() {

        if (document.getElementById("equipment_included").value === "no") {
            return "";
        }

        const equipment = [];
        document.querySelectorAll("#equipmentList input[type='checkbox']").forEach(item => {

            if (item.checked) {
                equipment.push(item.value);
            }
        });
        return equipment.join(", ");
    }

    function isCustomTimeFacility(name) {
      return ["AI Lab", "CC Lab", "LR501"].includes(name);
    }

    function addTimeSlotRow(start = "", end = "") {
      const container = document.getElementById("timeSlotContainer");

      const row = document.createElement("div");
      row.className = "time-row";

      row.innerHTML = `
        <input type="time" class="slot-start" value="${start}">
        <span>to</span>
        <input type="time" class="slot-end" value="${end}">
        <button type="button" onclick="this.parentElement.remove()">X</button>
      `;

      container.appendChild(row);
    }

    function saveFacility() {
      const facility_id = document.getElementById("facility_id").value;

      const selectedFacilityType =
        document.getElementById("facility_type").value;

      const finalFacilityType =
        selectedFacilityType === "Other"
          ? document.getElementById("other_facility_type").value.trim()
          : selectedFacilityType;

      const bookingFlowType = document.getElementById("booking_flow_type").value;

      let keyRequired = document.getElementById("key_required").value;
      let visibleTo = document.getElementById("visible_to").value;

      if (bookingFlowType === "staff_key_approval") {
        keyRequired = "1";
        visibleTo = "staff";
      }

      const name = document.getElementById("facility_name").value.trim();
      const isCustom = isCustomTimeFacility(name);

      let timeSlots = [];

      if (isCustom) {
        document.querySelectorAll("#timeSlotContainer .time-row").forEach(row => {
          const start = row.querySelector(".slot-start").value;
          const end = row.querySelector(".slot-end").value;

          if (start && end) {
            timeSlots.push({ start, end });
          }
        });
      }

      const facilityData = {
        facility_name: document.getElementById("facility_name").value.trim(),
        description: document.getElementById("description").value.trim(),
        facility_type: finalFacilityType,
        booking_flow_type: bookingFlowType,
        operating_start: document.getElementById("operating_start").value,
        operating_end: document.getElementById("operating_end").value,
        time_slots: timeSlots,
        location: document.getElementById("location").value.trim(),
        max_people: document.getElementById("max_people").value,
        availability_status: document.getElementById("availability_status").value,
        rules: document.getElementById("rules").value.trim(),
        additional_info: document.getElementById("additional_info").value.trim(),
        visible_to: visibleTo,
        key_required: keyRequired,
        equipment: getEquipmentText(),
        image_path: imageBase64 || null
      };

      if (
        !facilityData.facility_name ||
        !facilityData.facility_type ||
        !facilityData.booking_flow_type ||
        !facilityData.operating_start ||
        !facilityData.operating_end ||
        !facilityData.location ||
        !facilityData.max_people
      ) {
        document.getElementById("facilityMessage").style.color = "red";
        document.getElementById("facilityMessage").innerText = "Please fill in all required fields.";
        return;
      }

      const url = facility_id
        ? `/api/facilities/${facility_id}`
        : "/api/facilities";

      const method = facility_id ? "PUT" : "POST";

      fetch(url, {
        method,
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + localStorage.getItem("authToken")
        },
        body: JSON.stringify(facilityData)
      })
      .then(res => res.json())
      .then(data => {
        showAlert(data.message, data.success ? "success" : "error", data.success ? () => { backToFacilityList(); loadFacilities(); } : null);
      })
      .catch(() => {
        showAlert("Failed to save facility.", "error");
      });
    }

    function deleteFacility() {
      const facility_id = document.getElementById("facility_id").value;

      if (!facility_id) return;

      showConfirm("Are you sure you want to delete this facility?", () => {
        fetch(`/api/facilities/${facility_id}`, { 
          method: "DELETE",
          headers: {
            "Authorization": "Bearer " + localStorage.getItem("authToken")
          }
        })
          .then(res => res.json())
          .then(data => {
            showAlert(data.message, data.success ? "success" : "error", data.success ? () => { backToFacilityList(); loadFacilities(); } : null);
          })
          .catch(() => { showAlert("Failed to delete facility.", "error"); });
      });
    }

    function backToFacilityList() {
      document.getElementById("facilityFormPage").style.display = "none";
      document.getElementById("facilityListPage").style.display = "block";
      document.getElementById("facilityMessage").innerText = "";
    }

    function formatBookingFlow(flow) {
      if (flow === "normal_approval") return "Normal Approval";
      if (flow === "payment_required") return "Payment Required";
      if (flow === "direct_reservation") return "Direct Reservation";
      if (flow === "staff_key_approval") return "Staff Key Approval";
      return "Normal Approval";
    }

    function formatTime(time) {
      if (!time) return "-";

      const [hour, minute] = time.split(":");
      let h = parseInt(hour);
      const ampm = h >= 12 ? "PM" : "AM";

      h = h % 12;
      if (h === 0) h = 12;

      return `${h}:${minute} ${ampm}`;
    }

    function formatInputTime(time) {
      if (!time) return "";
      return time.substring(0, 5);
    }

    function logout() {
      localStorage.removeItem("user");
      sessionStorage.removeItem("user");
      window.location.href = "login.html";
    }

    function showAlert(message, type, onClose) {
      document.getElementById("modalIcon").innerHTML = type === "success"
        ? `<div style="width:44px; height:44px; background:#dcfce7; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px;"><svg xmlns="http://www.w3.org/2000/svg" height="36px" viewBox="0 -960 960 960" width="36px" fill="#22c55e"><path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z"/></svg></div>`
        : `<div style="width:44px; height:44px; background:#fee2e2; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px;"><svg xmlns="http://www.w3.org/2000/svg" height="36px" viewBox="0 -960 960 960" width="36px" fill="#D12E26"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg></div>`;
      document.getElementById("modalTitle").innerText = type === "success" ? "Success" : "Error";
      document.getElementById("modalTitle").style.color = "#D12E26";
      document.getElementById("modalTitle").style.fontSize = "24px";
