<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Key Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-body">

  <div id="appHeader"></div>

  <div class="dashboard-layout">

    <div id="appSidebar"></div>

    <main class="main-content">

      <h1 class="page-title">Key Management</h1>

      <p class="page-subtitle">
        Monitor live key possession, deadlines and issue reminders
      </p>

      <div class="manage-user-toolbar">
        <div class="user-search-box">
          <input 
            type="text" 
            id="keySearch" 
            placeholder="Search by room or staff name..."
            onkeyup="searchKeys()"
          >
        </div>

        <select id="keyStatusFilter" class="key-status-filter" onchange="searchKeys()">
          <option value="">Filter: All Status</option>
          <option value="pending_collection">Pending Collection</option>
          <option value="collected">Key Collected</option>
          <option value="returned">Returned</option>
          <option value="overdue">Overdue</option>
          <option value="late">Late (Returned Late)</option>
        </select>
      </div>

      <div id="keyList"></div>

    </main>

  </div>

  <script src="component.js"></script>

  <script>
    loadLayout("key-management");

    const user =
      JSON.parse(localStorage.getItem("user")) ||
      JSON.parse(sessionStorage.getItem("user"));

    if (!user || user.role !== "admin") {
      window.location.href = "login.html";
    }

    let allKeys = [];

    loadKeyManagement();

    function loadKeyManagement() {
      fetch("/api/admin/key-management", {
        headers: {
          "Authorization": "Bearer " + localStorage.getItem("authToken")
        }
      })
        .then(res => res.json())
        .then(data => {
          if (!data.success) {
            document.getElementById("keyList").innerHTML =
              "<p>Failed to load key records.</p>";
            return;
          }

          allKeys = data.keys;
          renderKeys(allKeys);
        })
        .catch(() => {
          document.getElementById("keyList").innerHTML =
            "<p>Failed to load key records.</p>";
        });
    }

    function renderKeys(keys) {
      const keyList = document.getElementById("keyList");
      keyList.innerHTML = "";

      if (keys.length === 0) {
        keyList.innerHTML = "<p>No active key records found.</p>";
        return;
      }

      keys.forEach(item => {
        keyList.innerHTML += `
          <div class="key-card">

            <img 
              src="${item.image_path || 'images/bg-image-2.jpeg'}" 
              class="key-card-img"
              alt="${item.facility_name}"
            >

            <div class="key-card-info">
              <h3>${item.facility_name} Key</h3>

              <p>
                <img class="key-info-icon" src="images/person_24dp_D12E26_FILL0_wght400_GRAD0_opsz24.svg" alt="">
                <strong>Holder:</strong> ${item.holder_name}
              </p>

              <p>
                <img class="key-info-icon" src="images/calendar_month_24dp_D12E26_FILL0_wght400_GRAD0_opsz24.svg" alt="">
                <strong>Date:</strong> ${formatDate(item.booking_date)}
              </p>

              <p>
                <img class="key-info-icon" src="images/clock_loader_10_24dp_D12E26_FILL0_wght400_GRAD0_opsz24.svg" alt="">
                <strong>Start Time:</strong> ${formatTime(item.start_time)}
              </p>

              <p>
                <img class="key-info-icon" src="images/clock_loader_60_24dp_D12E26_FILL0_wght400_GRAD0_opsz24.svg" alt="">
                <strong>End Time:</strong> ${formatTime(item.end_time)}
              </p>

              ${
                item.key_returned_at
                  ? `<p>
                      <img class="key-info-icon" src="images/done_all_24dp_D12E26_FILL0_wght400_GRAD0_opsz24.svg" alt="">
                      <strong>Returned At:</strong> ${formatReturnedTime(item.key_returned_at)}
                    </p>`
                  : ""
              }
            </div>

            <div class="key-card-status">
              ${getKeyStatusText(item)}
            </div>

            ${getKeyActionButton(item)}

          </div>
        `;
      });
    }

    function searchKeys() {
      const searchValue =
        document.getElementById("keySearch").value.toLowerCase();

      const statusValue =
        document.getElementById("keyStatusFilter").value;

      let filtered = [...allKeys];

      if (searchValue) {
        filtered = filtered.filter(item =>
          (item.facility_name || "").toLowerCase().includes(searchValue) ||
          (item.holder_name || "").toLowerCase().includes(searchValue)
        );
      }

      if (statusValue) {
        filtered = filtered.filter(item => {
          if (statusValue === "overdue") {
            return isOverdue(item);
          }

          if (statusValue === "returned") {
            return (
              (item.key_status === "returned" ||
              item.booking_status === "completed") &&
              !isLate(item)
            );
          }

          if (statusValue === "late") {
            return isLate(item);
          }

          return item.key_status === statusValue;
        });
      }

      renderKeys(filtered);
    }

    function getKeyStatusText(item) {
      if (isLate(item)) {
        return `<span class="key-late">Late - Returned Late</span>`;
      }
      
      if (
        item.key_status === "returned" ||
        item.booking_status === "completed"
      ) {
        return `<span class="key-returned">Returned</span>`;
      }

    if (
        item.booking_status === "approved" &&
        item.key_status === "pending_collection"
    ) {
        return ``;
    }

      if (
        item.booking_status === "key_collected" &&
        item.key_status === "collected"
      ) {
        if (isOverdue(item)) {
          return `<span class="key-overdue">Overdue - Not Returned</span>`;
        }

        return `
          <span class="key-time-left">
            Waiting to be Returned<br>
            ${getTimeLeft(item)}
          </span>
        `;
      }

      return `<span class="key-pending">Pending</span>`;
    }

    function getKeyActionButton(item) {
      if (
        item.booking_status === "approved" &&
        item.key_status === "pending_collection"
      ) {
        return `
          <button class="action-main-btn" onclick="markKeyCollected(${item.booking_id})">
            Key Collected
          </button>
        `;
      }

      return `
        <button class="key-more-btn" onclick="viewKeyRecord(${item.booking_id})" title="View Details">
          <img 
            src="images/arrow_forward_ios_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.svg"
            class="key-arrow-icon"
            alt="View Details"
          >
        </button>
      `;
    }

    function markKeyCollected(bookingId) {
    const modal = document.getElementById("keyConfirmModal");
    modal.style.display = "flex";

    document.getElementById("keyModalCancel").onclick = () => {
      modal.style.display = "none";
    };

    modal.onclick = (e) => {
      if (e.target === modal) modal.style.display = "none";
    };

    document.getElementById("keyModalConfirm").onclick = () => {
      modal.style.display = "none";
      fetch(`/api/admin/bookings/${bookingId}/collect-key`, {
        method: "PUT",
        headers: { "Authorization": "Bearer " + localStorage.getItem("authToken") }
      })
      .then(res => res.json())
      .then(data => {
        const successModal = document.getElementById("keySuccessModal");
        document.getElementById("keySuccessMessage").textContent = data.message;
        successModal.style.display = "flex";
        document.getElementById("keySuccessOk").onclick = () => {
          successModal.style.display = "none";
          loadKeyManagement();
        };
      })
      .catch(() => {
        const successModal = document.getElementById("keySuccessModal");
        document.getElementById("keySuccessMessage").textContent = "Failed to update key status.";
        successModal.style.display = "flex";
        document.getElementById("keySuccessOk").onclick = () => {
          successModal.style.display = "none";
        };
      });
    };
  }

    function isOverdue(item) {
      if (
        item.key_status === "returned" ||
        item.booking_status === "completed"
      ) {
        return false;
      }

      const endDateTime = new Date(`${item.booking_date}T${item.end_time}`);
      const now = new Date();

      return now > endDateTime;
    }

    function isLate(item) {
      if (!item.key_returned_at) return false;

      const endDateTime = new Date(`${item.booking_date}T${item.end_time}`);
      const returnedTime = new Date(item.key_returned_at);

      return returnedTime > endDateTime;
    }

    function getTimeLeft(item) {
      const endDateTime = new Date(`${item.booking_date}T${item.end_time}`);
      const now = new Date();

      const diffMs = endDateTime - now;

      if (diffMs <= 0) {
        return "Due now";
      }

      const diffMin = Math.floor(diffMs / 60000);
      const hours = Math.floor(diffMin / 60);
      const minutes = diffMin % 60;

      if (hours > 0) {
        return `${hours} hr ${minutes} min left`;
      }

      return `${minutes} min left`;
    }

    function viewKeyRecord(bookingId) {
      window.location.href = `booking-details.html?id=${bookingId}&source=key-management`;
    }

    function formatDate(dateValue) {
      if (!dateValue) return "-";

      const [year, month, day] = dateValue.split("-");
      const date = new Date(year, month - 1, day);

      return date.toLocaleDateString("en-MY", {
        day: "2-digit",
        month: "short",
        year: "numeric"
      });
    }

    function formatTime(time) {
      if (!time) return "-";

      const [hour, minute] = time.split(":");
      let h = parseInt(hour);
      const ampm = h >= 12 ? "PM" : "AM";

      h = h % 12;
      if (h === 0) h = 12;

      return `${h}:${minute} ${ampm}`;
    }

    function formatReturnedTime(dateTimeValue) {
      if (!dateTimeValue) return "-";

      const date = new Date(dateTimeValue);

      return date.toLocaleString("en-MY", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit",
        hour12: true
      });
    }

    function logout() {
      localStorage.removeItem("user");
      sessionStorage.removeItem("user");
      window.location.href = "login.html";
    }
  </script>

<div class="custom-modal-overlay" id="keyConfirmModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.3); z-index:9999; align-items:center; justify-content:center;">
  <div class="custom-modal-box">
    <div class="custom-modal-icon">
      <div style="width:56px; height:56px; border-radius:50%; background:#fff4e6; display:flex; align-items:center; justify-content:center; margin:0 auto;">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 -960 960 960" fill="#D12E26">
          <path d="M280-400q-83 0-141.5-58.5T80-600q0-83 58.5-141.5T280-800q83 0 141.5 58.5T480-600q0 29-6.5 54.5T455-498l246 246q9 9 9 21t-9 21l-80 80q-9 9-21 9t-21-9l-26-26-34 34q-9 9-21.5 9T476-122l-36-38-26 26q-9 9-21 9t-21-9l-43-43q-20 13-42.5 20T280-400Zm0-80q50 0 85-35t35-85q0-50-35-85t-85-35q-50 0-85 35t-35 85q0 50 35 85t85 35Zm0-80q-17 0-28.5-11.5T240-600q0-17 11.5-28.5T280-640q17 0 28.5 11.5T320-600q0 17-11.5 28.5T280-560Z"/>
        </svg>
      </div>
    </div>
    <p class="custom-modal-title" style="font-weight:700; margin:16px 0 6px;">Confirm Key Collection</p>
    <p class="custom-modal-message">Please confirm that the key has been handed to the holder.</p>
    <div class="custom-modal-buttons">
      <button class="custom-modal-btn-cancel" id="keyModalCancel">Cancel</button>
      <button class="custom-modal-btn-confirm" id="keyModalConfirm">Yes, collected</button>
    </div>
  </div>
</div>

<div class="custom-modal-overlay" id="keySuccessModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.3); z-index:9999; align-items:center; justify-content:center;">
  <div class="custom-modal-box">
    <div class="custom-modal-icon">
      <div style="width:56px; height:56px; border-radius:50%; background:#d9f7df; display:flex; align-items:center; justify-content:center; margin:0 auto;">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 -960 960 960" fill="#2e7d32">
          <path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z"/>
        </svg>
      </div>
    </div>
    <p class="custom-modal-title" style="font-weight:700; margin:16px 0 6px;">Key Collected</p>
    <p class="custom-modal-message" id="keySuccessMessage"></p>
    <div class="custom-modal-buttons">
      <button class="custom-modal-btn-confirm" id="keySuccessOk" style="width:100%;">OK</button>
    </div>
  </div>
</div>

</body>
</html>
