<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Page title shown on the browser tab -->
  <title>Staff Dashboard</title>

  <!-- Google Font: Poppins is used for consistent typography across the system -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Main external CSS file for the system design -->
  <link rel="stylesheet" href="style.css">

  <!--
    Styles for the custom date picker.
    Kept inline here so the component is self-contained; feel free to move
    this block into style.css if you'd rather keep all styling in one file.
  -->
  <style>
    /* Wrapper that positions the dropdown relative to the trigger button */
    .custom-datepicker {
      position: relative;
      display: inline-block;
      font-family: 'Poppins', sans-serif;
    }

    /* Trigger button that replaces the native <input type="date"> */
    .custom-date-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 160px;
      padding: 10px 14px;
      background: #fff;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      color: #D12E26;
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .custom-date-btn:hover {
      border-color: #D12E26;
    }

    .custom-date-btn.active {
      border-color: #D12E26;
    }

    .custom-date-btn .calendar-icon {
      margin-left: auto;
      flex-shrink: 0;
      color: #D12E26;
    }

    .custom-date-btn .date-label.placeholder {
      color: #D12E26;
      opacity: 0.85;
    }

    /* Dropdown panel containing the calendar */
    .date-picker-menu {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      z-index: 50;
      width: 248px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
      padding: 12px;
    }

    .date-picker-menu.open {
      display: block;
    }

    /* Month header with prev/next navigation */
    .date-picker-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .date-picker-header .month-label {
      font-weight: 600;
      font-size: 13px;
      color: #1f2937;
      letter-spacing: 0.06em;
      word-spacing: 0.35em;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.15s ease;
    }

    .date-picker-header .month-label:hover {
      background: #fdecea;
      color: #D12E26;
    }

    /* Quick month-grid view, shown when the month/year label is clicked */
    .date-picker-months {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .date-picker-month {
      padding: 9px 0;
      border-radius: 8px;
      border: none;
      background: transparent;
      font-family: 'Poppins', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: #1f2937;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .date-picker-month:hover {
      background: #fdecea;
    }

    .date-picker-month.current-month {
      border: 1.5px solid #D12E26;
      color: #D12E26;
      font-weight: 600;
    }

    .date-picker-month.selected-month {
      background: #D12E26;
      color: #fff;
      font-weight: 600;
    }

    .date-picker-nav-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #1f2937;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .date-picker-nav-btn:hover {
      background: #f3f4f6;
    }

    /* Weekday row (Mon - Sun) */
    .date-picker-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      margin-bottom: 4px;
    }

    .date-picker-weekdays span {
      text-align: center;
      font-size: 10px;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
    }

    /* Day grid */
    .date-picker-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      row-gap: 8px;
    }

    .date-picker-day {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      margin: 0 auto;
      border-radius: 50%;
      border: none;
      background: transparent;
      font-family: 'Poppins', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: #1f2937;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .date-picker-day:hover:not(.disabled) {
      background: #fdecea;
    }

    .date-picker-day.outside {
      color: #d1d5db;
    }

    .date-picker-day.today {
      border: 1.5px solid #D12E26;
      color: #D12E26;
      font-weight: 600;
    }

    .date-picker-day.selected {
      background: #D12E26;
      color: #fff;
      font-weight: 600;
    }

    .date-picker-day.selected.today {
      border: none;
    }

    /* Footer with Clear / Done actions */
    .date-picker-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #f0f0f0;
    }

    .date-picker-clear-btn {
      background: none;
      border: none;
      color: #6b7280;
      font-family: 'Poppins', sans-serif;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      padding: 6px 4px;
    }

    .date-picker-clear-btn:hover {
      color: #D12E26;
    }

    .date-picker-done-btn {
      background: #D12E26;
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 7px 18px;
      font-family: 'Poppins', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .date-picker-done-btn:hover {
      background: #b52520;
    }
  </style>
</head>

<!--
  Body class:
  - dashboard-body applies the common dashboard layout styling.
-->
<body class="dashboard-body">

  <!--
    Header placeholder.
    The actual header content is loaded dynamically by component.js through loadLayout().
  -->
  <div id="appHeader"></div>

  <!-- Main dashboard layout wrapper containing sidebar and page content -->
  <div class="dashboard-layout">

    <!--
      Sidebar placeholder.
      The actual sidebar menu is loaded dynamically by component.js.
    -->
    <div id="appSidebar"></div>

    <!-- Main content area for the staff facilities page -->
    <main class="main-content">

      <!-- Page title shown at the top of the staff dashboard -->
      <h1 class="page-title">
        Welcome to INTI Facilities Management System
      </h1>

      <!-- Subtitle that briefly explains the page purpose -->
      <p class="page-subtitle">
        Find your space now! Reserve equipment, studios, and more.
      </p>

      <!--
        Filter bar section.
        This section allows staff to filter facilities by date and facility type.
      -->
      <div class="filter-bar">

        <!-- Date filter label -->
        <label>Filter By:</label>

        <!--
          Custom date picker.
          Replaces the native <input type="date"> with a styled dropdown
          calendar (month navigation, weekday header, Today marker, and a
          Done button), matching the reference design.
        -->
        <div class="custom-datepicker" id="dateDropdown">

          <!--
            Trigger button. Shows the selected date, or the dd/mm/yyyy
            placeholder when nothing is selected yet.
          -->
          <button type="button" class="custom-date-btn" id="dateTriggerBtn" onclick="toggleDatePicker()">
            <span id="dateLabel" class="date-label placeholder">dd/mm/yyyy</span>
            <svg class="calendar-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </button>

          <!-- Calendar dropdown panel -->
          <div class="date-picker-menu" id="datePickerMenu">

            <!-- Month header with prev/next navigation -->
            <div class="date-picker-header">
              <button type="button" class="date-picker-nav-btn" onclick="changeMonth(-1)" aria-label="Previous month">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
              </button>
              <span class="month-label" id="calendarMonthLabel" onclick="openMonthPicker()">August 2026</span>
              <button type="button" class="date-picker-nav-btn" onclick="changeMonth(1)" aria-label="Next month">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
              </button>
            </div>

            <!-- Weekday row -->
            <div class="date-picker-weekdays" id="calendarWeekdays">
              <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
            </div>

            <!-- Day grid, populated by renderCalendar() -->
            <div class="date-picker-days" id="calendarDays"></div>

            <!-- Footer actions -->
            <div class="date-picker-footer">
              <button type="button" class="date-picker-clear-btn" onclick="clearDate()">Clear</button>
              <button type="button" class="date-picker-done-btn" onclick="closeDatePicker()">Done</button>
            </div>
          </div>
        </div>

        <!--
          Hidden input that keeps the same id/behavior the rest of the app
          relies on (applyFilters() reads a "yyyy-mm-dd" value from #filterDate,
          and a "change" event is dispatched on it whenever a date is picked).
        -->
        <input type="hidden" id="filterDate">

        <!--
          Custom dropdown for selecting facility type filters.
          It uses checkboxes instead of a normal select dropdown so users can select multiple facility types.
        -->
        <div class="custom-dropdown" id="typeDropdown">

        <!--
          Dropdown button.
          When clicked, toggleDropdown() opens or closes the custom dropdown menu.
        -->
        <button class="custom-dropdown-btn" onclick="toggleDropdown()">

          <!-- This text changes based on selected facility type filters -->
          <span id="dropdownLabel">Facility Type</span>

          <!-- Dropdown arrow icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>

        <!--
          Dropdown menu containing all facility type checkbox options.
          The menu is shown/hidden by adding or removing the "open" class.
        -->
        <div class="custom-dropdown-menu" id="dropdownMenu">

            <!--
              Toggle all checkbox.
              This allows the user to select or deselect all facility types at once.
            -->
            <label class="dropdown-item">
                <input type="checkbox" id="toggleAll" checked>
                <span id="toggleAllLabel">Deselect All</span>
            </label>
            <hr>

            <!--
              Facility type option: Lab / Classroom.
              The value contains two facility types: Laboratory and Classroom.
              Later, the JavaScript splits this value by comma.
            -->
            <label class="dropdown-item">
                <input type="checkbox" value="Laboratory,Classroom" checked>
                <span>Lab / Classroom</span>
            </label>

            <!-- Facility type option: Sports Facility -->
            <label class="dropdown-item">
                <input type="checkbox" value="Sports Facility" checked>
                <span>Sports Facility</span>
            </label>

            <!-- Facility type option: Study Space -->
            <label class="dropdown-item">
                <input type="checkbox" value="Study Space" checked>
                <span>Study Space</span>
            </label>

            <!-- Facility type option: Music Facility -->
            <label class="dropdown-item">
                <input type="checkbox" value="Music Facility" checked>
                <span>Music Facility</span>
            </label>

            <!-- Facility type option: Other -->
            <label class="dropdown-item">
                <input type="checkbox" value="Other" checked>
                <span>Other</span>
            </label>
        </div>
      </div>
      </div>

      <!--
        Facility list container.
        Facility cards will be inserted here dynamically using JavaScript.
      -->
      <div id="facilityList" class="facility-grid"></div>

    </main>

  </div>

  <!-- Shared component script used to load header and sidebar layout -->
  <script src="component.js"></script>

  <script>
    /*
      Load the common system layout.

      "facilities" tells component.js which sidebar menu should be active.
      In this page, the Facilities menu should be highlighted.
    */
    loadLayout("facilities");

    /*
      Get the logged-in user data from browser storage.

      localStorage:
      - Usually keeps data even after the browser is closed.

      sessionStorage:
      - Keeps data only during the current browser tab/session.

      The system checks localStorage first.
      If user data is not found there, it checks sessionStorage.
    */
    const user =
      JSON.parse(localStorage.getItem("user")) ||
      JSON.parse(sessionStorage.getItem("user"));

    /*
      Access control for this page.

      This page is only for staff users.
      If there is no user, or the user's role is not staff,
      redirect the user back to the login page.
    */
    if (!user || user.role !== "staff") {
      window.location.href = "login.html";
    }

    /*
      Store all facilities loaded from the backend.

      This array is used later when applying filters.
      Instead of fetching from the database again every time,
      the system filters the facilities from this array.
    */
    let allFacilities = [];

    /*
      Load facilities immediately when the page is opened.
    */
    loadFacilities();

    /*
      Fetch facility data from the backend API.

      The staff role is sent to the backend as a query parameter.
      This allows the backend to return facilities that staff are allowed to view.
    */
    function loadFacilities() {
      fetch(`/api/facilities?role=${user.role}`, {
        headers: {
          /*
            Send the authentication token to the backend.

            The backend can use this token to verify that the user is logged in
            and allowed to access the facility data.
          */
          "Authorization": "Bearer " + localStorage.getItem("authToken")
        }
      })
        /*
          Convert the backend response into JSON format.
        */
        .then(res => res.json())

        /*
          Handle the data returned by the backend.
        */
        .then(data => {

          /*
            If the backend response is not successful,
            show an error message inside the facility list area.
          */
          if (!data.success) {
            document.getElementById("facilityList").innerHTML =
              "<p>Failed to load facilities.</p>";
            return;
          }

          /*
            Store all facilities returned from the backend.
            This is important because filtering uses this saved list.
          */
          allFacilities = data.facilities;

          /*
            Display all facilities on the page.
          */
          renderFacilities(allFacilities);

          /*
            Update the dropdown label and apply the current selected filters.
          */
          updateDropdown();
        })

        /*
          If the API request fails, show an error message.
          Example: server is not running or network connection fails.
        */
        .catch(() => {
          document.getElementById("facilityList").innerHTML =
            "<p>Failed to load facilities.</p>";
        });
    }

    /*
      Render facility cards on the page.

      Parameter:
      facilities
      - An array of facility objects to display.
      - This can be all facilities or filtered facilities.
    */
    function renderFacilities(facilities) {

      /*
        Get the facility list container where all facility cards will be displayed.
      */
      const facilityList = document.getElementById("facilityList");

      /*
        Clear existing facility cards before displaying the new list.
        This prevents duplicated cards when filters are applied.
      */
      facilityList.innerHTML = "";

      /*
        If there are no facilities to display,
        show a simple "No facilities found" message.
      */
      if (facilities.length === 0) {
        facilityList.innerHTML = "<p>No facilities found.</p>";
        return;
      }

      /*
        Loop through each facility and create a facility card for it.
      */
      facilities.forEach(facility => {

        // Determine if facility is available
        const isAvailable = facility.availability_status === 'available';

        // Use a CSS class for styling the disabled state
        const cardClass = isAvailable ? 'facility-card' : 'facility-card facility-disabled';

        // Define button state and appearance
        const buttonHtml = isAvailable 
          ? `<button onclick="window.location.href='facility-details.html?id=${facility.facility_id}'">View Details</button>`
          : `<button disabled style="background:#ccc; cursor:not-allowed;">${formatAvailability(facility.availability_status)}</button>`;

        /*
          Add the facility card HTML into the facility list.

          Each card includes:
          - Facility image
          - Availability badge
          - Facility name
          - Location
          - Maximum capacity
          - Operating time
          - View Details button or disabled status button
        */
        facilityList.innerHTML += `
          <div class="${cardClass}">
            <div class="facility-img">
              <img src="${facility.image_path || ''}" alt="${facility.facility_name}">
              <span class="status-badge ${!isAvailable ? 'badge-unavailable' : ''}">
                ${formatAvailability(facility.availability_status)}
              </span>
            </div>

            <div class="facility-info">
              <h3>${facility.facility_name}</h3>

              <p>
                <span class="facility-inline-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor">
                    <path d="m600-120-240-84-186 72q-20 8-37-4.5T120-170v-560q0-13 7.5-23t20.5-15l212-72 240 84 186-72q20-8 37 4.5t17 33.5v560q0 13-7.5 23T812-192l-212 72Zm-40-98v-468l-160-56v468l160 56Zm80 0 120-40v-474l-120 46v468Zm-440-10 120-46v-468l-120 40v474Zm440-458v468-468Zm-320-56v468-468Z"/>
                  </svg>
                </span>
                <span>Location: ${facility.location || "-"}</span>
              </p>

              <p>
                <span class="facility-inline-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor">
                    <path d="M40-160v-112q0-34 17.5-62.5T104-378q62-31 126-46.5T360-440q66 0 130 15.5T616-378q29 15 46.5 43.5T680-272v112H40Zm720 0v-120q0-44-24.5-84.5T666-434q51 6 96 20.5t84 35.5q36 20 55 44.5t19 53.5v120H760ZM247-527q-47-47-47-113t47-113q47-47 113-47t113 47q47 47 47 113t-47 113q-47 47-113 47t-113-47Zm466 0q-47 47-113 47-11 0-28-2.5t-28-5.5q27-32 41.5-71t14.5-81q0-42-14.5-81T544-792q14-5 28-6.5t28-1.5q66 0 113 47t47 113q0 66-47 113ZM120-240h480v-32q0-11-5.5-20T580-306q-54-27-109-40.5T360-360q-56 0-111 13.5T140-306q-9 5-14.5 14t-5.5 20v32Zm296.5-343.5Q440-607 440-640t-23.5-56.5Q393-720 360-720t-56.5 23.5Q280-673 280-640t23.5 56.5Q327-560 360-560t56.5-23.5ZM360-240Zm0-400Z"/>
                  </svg>
                </span>
                <span>Max. Capacity: ${facility.max_people || "-"}</span>
              </p>

              <p>
                <span class="facility-inline-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor">
                    <path d="M582-298 440-440v-200h80v167l118 118-56 57ZM440-720v-80h80v80h-80Zm280 280v-80h80v80h-80ZM440-160v-80h80v80h-80ZM160-440v-80h80v80h-80ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/>
                  </svg>
                </span>
                <span>Time: ${formatTime(facility.operating_start)} - ${formatTime(facility.operating_end)}</span>
              </p>

              ${buttonHtml}
            </div>
          </div>
        `;
      });
    }

    /*
      Open or close the facility type dropdown menu.

      This works by toggling:
      - "open" class on the dropdown menu
      - "active" class on the dropdown button
    */
    function toggleDropdown() {
      document.getElementById("dropdownMenu").classList.toggle("open");
      document.querySelector(".custom-dropdown-btn").classList.toggle("active");
      // Keep only one dropdown open at a time.
      closeDatePicker();
    }

    /*
      Close the dropdown menu when the user clicks outside of it.

      This improves user experience because the dropdown will not stay open
      after the user clicks somewhere else on the page.
    */
    document.addEventListener("click", function(e) {
      const dropdown = document.getElementById("typeDropdown");

      /*
        Check whether the clicked area is outside the dropdown.
        If yes, close the dropdown menu and remove the active button style.
      */
      if (dropdown && !dropdown.contains(e.target)) {
        document.getElementById("dropdownMenu").classList.remove("open");
        document.querySelector(".custom-dropdown-btn").classList.remove("active");
      }

      /*
        Same idea for the custom date picker: close it if the click
        landed outside of it.
      */
      const dateDropdown = document.getElementById("dateDropdown");
      if (dateDropdown && !dateDropdown.contains(e.target)) {
        closeDatePicker();
      }
    });

    /*
      Select all facility type checkboxes inside the dropdown.

      These are the checkbox inputs that have a value,
      such as Laboratory, Classroom, Sports Facility, Study Space, etc.
    */
    const facilityCheckboxes = document.querySelectorAll('.dropdown-item input[value]');

    /*
      Get the dropdown label.
      This text changes based on what facility types are selected.
    */
    const dropdownLabel = document.getElementById("dropdownLabel");

    /*
      Get the "toggle all" checkbox and its label.
      This is used to select or deselect all facility types.
    */
    const toggleAll = document.getElementById("toggleAll");
    const toggleAllLabel = document.getElementById("toggleAllLabel");

    /*
      Add change event listeners to every facility type checkbox.

      Whenever the user checks or unchecks a facility type,
      updateDropdown() will update the dropdown label and apply filters.
    */
    facilityCheckboxes.forEach(cb => {
        cb.addEventListener("change", updateDropdown);
    });

    /*
      Add change event listener to the toggle all checkbox.

      When clicked:
      - If all facility types are already selected, deselect all.
      - Otherwise, select all facility types.
    */
    toggleAll.addEventListener("change", function () {
        const allSelected = [...facilityCheckboxes].every(cb => cb.checked);

        if (allSelected) {
            facilityCheckboxes.forEach(cb => cb.checked = false);
        } else {
            facilityCheckboxes.forEach(cb => cb.checked = true);
        }

        updateDropdown();
    });

    /*
      Apply facility filters based on selected facility type checkboxes.

      This function:
      1. Gets all checked facility types.
      2. Starts with all facilities.
      3. Filters facilities by selected facility types.
      4. Renders the filtered facilities.
    */
    function applyFilters() {

        /*
          Create a list of selected facility type values.

          flatMap is used because some checkbox values contain multiple types.
          Example:
          "Laboratory,Classroom" becomes ["Laboratory", "Classroom"].
        */
        const checked = [...facilityCheckboxes]
            .filter(cb => cb.checked)
            .flatMap(cb => cb.value.split(','));

        /*
          Copy all facilities first.
          This prevents directly modifying the original allFacilities array.
        */
        let filtered = [...allFacilities];

        /*
          If the toggleAll checkbox is not checked,
          filter the facility list based on selected facility types.
        */
        if (!document.getElementById("toggleAll").checked) {
            filtered = filtered.filter(facility =>
                checked.includes(facility.facility_type)
            );
        }

        /*
          Display the filtered facility list.
        */
        renderFacilities(filtered);
    }

    /*
      Update dropdown status and label.

      This function:
      - Checks how many facility type checkboxes are selected.
      - Updates the Select All / Deselect All label.
      - Updates the dropdown button label.
      - Calls applyFilters() to update the facility cards.
    */
    function updateDropdown() {
        const checkedBoxes = [...facilityCheckboxes].filter(cb => cb.checked);

        /*
          If all facility type checkboxes are selected:
          - Check the toggleAll checkbox.
          - Show "Deselect All".
        */
        if (checkedBoxes.length === facilityCheckboxes.length) {
            toggleAll.checked = true;
            toggleAllLabel.textContent = "Deselect All";
        } else {
            /*
              If not all checkboxes are selected:
              - Uncheck the toggleAll checkbox.
              - Show "Select All".
            */
            toggleAll.checked = false;
            toggleAllLabel.textContent = "Select All";
        }

        /*
          Update the dropdown button label.

          If no checkbox is selected or all checkboxes are selected,
          show the general label "Facility Type".
        */
        if (
            checkedBoxes.length === 0 ||
            checkedBoxes.length === facilityCheckboxes.length
        ) {
            dropdownLabel.textContent = "Facility Type";
        } else {
            // Grabs the clean text label for the dropdown display instead of the raw value
            const label = checkedBoxes.map(cb => cb.nextElementSibling.textContent.trim()).join(", ");
            dropdownLabel.textContent =
                label.length > 20
                    ? label.substring(0, 20) + "..."
                    : label;
        }

        /*
          After updating the dropdown label,
          apply the selected filters to the facility list.
        */
        applyFilters();
    }

    /*
      Convert database availability status into user-friendly text.

      Example:
      - "available" becomes "Available Now"
      - "maintenance" becomes "Maintenance"
    */
    function formatAvailability(status) {
      if (status === "available") return "Available Now";
      if (status === "unavailable") return "Unavailable";
      if (status === "maintenance") return "Maintenance";
      return "Available Now";
    }

    /* =======================================================
       Custom date picker
       =======================================================
       Replaces the native <input type="date"> with a styled
       dropdown calendar: a month header with prev/next arrows,
       a weekday row, a day grid (today outlined, selected day
       filled), and Clear / Done actions.

       The hidden #filterDate input still holds the selected
       date as "yyyy-mm-dd" and still fires a "change" event,
       so applyFilters() keeps working exactly as before.
    ======================================================= */

    const MONTH_NAMES = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];

    // The month/year currently shown in the calendar grid.
    const today = new Date();
    let calendarYear = today.getFullYear();
    let calendarMonth = today.getMonth(); // 0-11

    // The date the user has actually selected (null = nothing selected yet).
    let selectedDate = null; // Date object

    // Which view the dropdown is currently showing: "days" (the normal
    // calendar grid) or "months" (the quick month picker opened by
    // clicking the "Month Year" label).
    let pickerView = "days";

    /*
      Open or close the date picker dropdown.
    */
    function toggleDatePicker() {
      const menu = document.getElementById("datePickerMenu");
      const btn = document.getElementById("dateTriggerBtn");
      const isOpen = menu.classList.contains("open");

      if (isOpen) {
        closeDatePicker();
      } else {
        // Jump the calendar back to the selected date's month (or today's).
        const base = selectedDate || today;
        calendarYear = base.getFullYear();
        calendarMonth = base.getMonth();
        pickerView = "days";
        renderCalendar();

        menu.classList.add("open");
        btn.classList.add("active");

        // Keep only one dropdown open at a time.
        document.getElementById("dropdownMenu").classList.remove("open");
        document.querySelector(".custom-dropdown-btn").classList.remove("active");
      }
    }

    /*
      Close the date picker dropdown.
    */
    function closeDatePicker() {
      document.getElementById("datePickerMenu").classList.remove("open");
      document.getElementById("dateTriggerBtn").classList.remove("active");
    }

    /*
      Move the calendar forward or backward.

      In the normal day-grid view this steps one month at a time.
      In the quick month-grid view (opened via the label) it steps
      one year at a time instead, since months are picked by clicking
      them directly.

      Parameter:
      delta
      - -1 to go back, 1 to go forward.
    */
    function changeMonth(delta) {
      if (pickerView === "months") {
        calendarYear += delta;
        renderCalendar();
        return;
      }

      calendarMonth += delta;

      if (calendarMonth < 0) {
        calendarMonth = 11;
        calendarYear--;
      } else if (calendarMonth > 11) {
        calendarMonth = 0;
        calendarYear++;
      }

      renderCalendar();
    }

    /*
      Open the quick month picker: clicking the "Month Year" label
      switches the dropdown from the day grid to a 3x4 grid of month
      names for the current calendarYear, so the user can jump to a
      different month in one click instead of paging with the arrows.
    */
    function openMonthPicker() {
      pickerView = "months";
      renderCalendar();
    }

    /*
      Handle a month being picked from the quick month-grid view:
      switch back to the day grid for that month/year.
    */
    function pickMonth(monthIndex) {
      calendarMonth = monthIndex;
      pickerView = "days";
      renderCalendar();
    }

    /*
      Build and display whichever view is currently active:
      the day grid (with the "Month Year" header) or the quick
      month-grid picker (with just the "Year" header).
    */
    function renderCalendar() {
      if (pickerView === "months") {
        renderMonthGrid();
        return;
      }
      renderDayGrid();
    }

    /*
      Build and display the day grid for the current calendar
      month/year, along with the clickable "Month Year" header label.
    */
    function renderDayGrid() {
      document.getElementById("calendarMonthLabel").textContent =
        `${MONTH_NAMES[calendarMonth]} ${calendarYear}`;
      document.getElementById("calendarWeekdays").style.display = "grid";

      const daysContainer = document.getElementById("calendarDays");
      daysContainer.className = "date-picker-days";
      daysContainer.innerHTML = "";

      // JS getDay(): 0 = Sunday ... 6 = Saturday. Convert to a Monday-first index (0-6).
      const firstOfMonth = new Date(calendarYear, calendarMonth, 1);
      const startOffset = (firstOfMonth.getDay() + 6) % 7;

      const daysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();
      const daysInPrevMonth = new Date(calendarYear, calendarMonth, 0).getDate();

      // Leading days from the previous month, shown greyed out.
      for (let i = startOffset; i > 0; i--) {
        daysContainer.appendChild(
          buildDayButton(daysInPrevMonth - i + 1, true, null)
        );
      }

      // Days in the current month.
      for (let day = 1; day <= daysInMonth; day++) {
        const dateObj = new Date(calendarYear, calendarMonth, day);
        daysContainer.appendChild(buildDayButton(day, false, dateObj));
      }

      // Trailing days from the next month so the grid stays a full 6 rows.
      const totalCells = startOffset + daysInMonth;
      const trailingCount = (7 - (totalCells % 7)) % 7;
      for (let day = 1; day <= trailingCount; day++) {
        daysContainer.appendChild(buildDayButton(day, true, null));
      }
    }

    /*
      Build and display the quick month-grid picker: 12 month
      buttons (3 columns x 4 rows) for calendarYear. The header
      shows just the year, and the prev/next arrows step by year
      (handled in changeMonth()) instead of by month.
    */
    function renderMonthGrid() {
      document.getElementById("calendarMonthLabel").textContent = `${calendarYear}`;
      document.getElementById("calendarWeekdays").style.display = "none";

      const daysContainer = document.getElementById("calendarDays");
      daysContainer.className = "date-picker-months";
      daysContainer.innerHTML = "";

      MONTH_NAMES.forEach((name, index) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "date-picker-month";
        btn.textContent = name.slice(0, 3);

        if (index === today.getMonth() && calendarYear === today.getFullYear()) {
          btn.classList.add("current-month");
        }

        if (
          selectedDate &&
          index === selectedDate.getMonth() &&
          calendarYear === selectedDate.getFullYear()
        ) {
          btn.classList.add("selected-month");
        }

        btn.addEventListener("click", () => pickMonth(index));
        daysContainer.appendChild(btn);
      });
    }

    /*
      Create a single day cell for the calendar grid.

      Parameters:
      day
      - The day-of-month number to display.
      outside
      - True if this day belongs to the previous/next month (greyed out,
        not clickable).
      dateObj
      - The actual Date this button represents (null for outside days).
    */
    function buildDayButton(day, outside, dateObj) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "date-picker-day";
      btn.textContent = day;

      if (outside) {
        btn.classList.add("outside", "disabled");
        btn.disabled = true;
        return btn;
      }

      if (isSameDate(dateObj, today)) {
        btn.classList.add("today");
      }

      if (selectedDate && isSameDate(dateObj, selectedDate)) {
        btn.classList.add("selected");
      }

      btn.addEventListener("click", () => selectDay(dateObj));
      return btn;
    }

    /*
      Check whether two Date objects fall on the same calendar day.
    */
    function isSameDate(a, b) {
      return a && b &&
        a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate();
    }

    /*
      Handle the user picking a day on the calendar:
      - Store it as the selected date.
      - Update the trigger button's label.
      - Sync the hidden #filterDate input and fire its "change" event
        so applyFilters() runs.
      - Re-render the grid so the new selection is highlighted.
    */
    function selectDay(dateObj) {
      selectedDate = dateObj;
      updateDateLabel();
      syncHiddenInput();
      renderCalendar();
    }

    /*
      Clear the currently selected date and go back to showing
      the dd/mm/yyyy placeholder.
    */
    function clearDate() {
      selectedDate = null;
      updateDateLabel();
      syncHiddenInput();
      renderCalendar();
    }

    /*
      Update the trigger button's text: either the formatted
      selected date, or the dd/mm/yyyy placeholder.
    */
    function updateDateLabel() {
      const label = document.getElementById("dateLabel");

      if (!selectedDate) {
        label.textContent = "dd/mm/yyyy";
        label.classList.add("placeholder");
        return;
      }

      const dd = String(selectedDate.getDate()).padStart(2, "0");
      const mm = String(selectedDate.getMonth() + 1).padStart(2, "0");
      const yyyy = selectedDate.getFullYear();

      label.textContent = `${dd}/${mm}/${yyyy}`;
      label.classList.remove("placeholder");
    }

    /*
      Keep the hidden #filterDate input (used by the rest of the app)
      in sync with the selected date, and dispatch a "change" event
      so any existing listeners (like applyFilters()) still fire.
    */
    function syncHiddenInput() {
      const hiddenInput = document.getElementById("filterDate");

      if (!selectedDate) {
        hiddenInput.value = "";
      } else {
        const yyyy = selectedDate.getFullYear();
        const mm = String(selectedDate.getMonth() + 1).padStart(2, "0");
        const dd = String(selectedDate.getDate()).padStart(2, "0");
        hiddenInput.value = `${yyyy}-${mm}-${dd}`;
      }

      hiddenInput.dispatchEvent(new Event("change"));
    }

    /*
      When the date filter changes, apply the filters again.

      In the current code, applyFilters() mainly filters by facility type.
      The date input is still connected here so it can support filtering behavior.
    */
    document.getElementById("filterDate").addEventListener("change", function() {
      applyFilters();
    });

    // Draw the initial calendar grid for the current month.
    renderCalendar();

    /*
      Convert time from 24-hour format to 12-hour format.

      Example:
      "13:30:00" becomes "1:30 PM"
      "09:00:00" becomes "9:00 AM"
    */
    function formatTime(time) {

      /*
        If time is empty, null, or undefined,
        return "-" as a fallback display value.
      */
      if (!time) return "-";

      /*
        Split the time string into hour and minute.

        Example:
        "13:30:00" becomes:
        hour = "13"
        minute = "30"
      */
      const [hour, minute] = time.split(":");

      /*
        Convert hour from string to number,
        then decide whether it is AM or PM.
      */
      let h = parseInt(hour);
      const ampm = h >= 12 ? "PM" : "AM";

      /*
        Convert 24-hour format into 12-hour format.
        If the converted hour becomes 0, display it as 12.
      */
      h = h % 12;
      if (h === 0) h = 12;

      /*
        Return the final formatted time.
      */
      return `${h}:${minute} ${ampm}`;
    }

    /*
      Logout function.

      This removes user data from browser storage
      and redirects the user back to the login page.
    */
    function logout() {
      localStorage.removeItem("user");
      sessionStorage.removeItem("user");
      window.location.href = "login.html";
    }
  </script>

</body>
