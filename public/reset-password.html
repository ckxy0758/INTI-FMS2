<!DOCTYPE html>
<html>
<head>
  <title>Reset Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

  <main class="login-hero">
    <div class="login-card">
      <h1>Reset Password</h1>
      <p>Enter your new password below.</p>

      <label>New Password</label>
      <div class="password-input">
        <input type="password" id="newPassword" placeholder="Enter new password">
        <span class="toggle-eye" onclick="togglePassword('newPassword','eye1')">
          <img src="images/eye-open.png" class="eye-icon" id="eye1">
        </span>
      </div>

      <label>Confirm Password</label>
      <div class="password-input">
        <input type="password" id="confirmPassword" placeholder="Confirm new password">
        <span class="toggle-eye" onclick="togglePassword('confirmPassword','eye2')">
          <img src="images/eye-open.png" class="eye-icon" id="eye2">
        </span>
      </div>

      <button onclick="submitNewPassword()">Update Password</button>
      <p id="message"></p>
    </div>
  </main>

<script>
function togglePassword(inputId, eyeId) {
  const input = document.getElementById(inputId);
  const eye = document.getElementById(eyeId);
  if (input.type === "password") {
    input.type = "text";
    eye.src = "images/eye-close.png";
  } else {
    input.type = "password";
    eye.src = "images/eye-open.png";
  }
}

function submitNewPassword() {
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');
  
  const newPassword = document.getElementById("newPassword").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  const message = document.getElementById("message");

  message.innerText = "";

  if (!token) {
    message.style.color = "#ffb4b4";
    message.innerText = "Invalid link. Please request a new password reset.";
    return;
  }

  if (!newPassword || !confirmPassword) {
    message.style.color = "#ffb4b4";
    message.innerText = "Please fill in all fields";
    return;
  }

  if (newPassword.length < 6) {
    message.style.color = "#ffb4b4";
    message.innerText = "Password must be at least 6 characters";
    return;
  }

  if (newPassword !== confirmPassword) {
    message.style.color = "#ffb4b4";
    message.innerText = "Passwords do not match";
    return;
  }

  fetch("/api/reset-password", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ token, newPassword })
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      message.style.color = "#22c55e";
      message.innerText = data.message;
      setTimeout(() => {
        window.location.href = "login.html";
      }, 2000);
    } else {
      message.style.color = "#ffb4b4";
      message.innerText = data.message;
    }
  })
  .catch(() => {
    message.style.color = "#ffb4b4";
    message.innerText = "Server connection failed";
  });
}
</script>
</body>
</html>
