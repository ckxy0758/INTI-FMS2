<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanning...</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding-top: 20%; background-color: #f4f7f6; }
    .loader { margin: 20px auto; border: 4px solid #f3f3f3; border-top: 4px solid #0056b3; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <h2>Finding your booking...</h2>
  <div class="loader"></div>
  <p id="errorMessage" style="color: red;"></p>

  <script>
    // 1. ALWAYS get the parameters first
    const urlParams = new URLSearchParams(window.location.search);
    const facilityId = urlParams.get('facility_id');

    // 2. CHECK LOGIN FIRST - Before anything else
    const user = JSON.parse(localStorage.getItem("user")) || JSON.parse(sessionStorage.getItem("user"));
    
    if (!user) {
      alert("Please log in to the Facility Management System first to check in.");
      if (facilityId) {
        window.location.href = `login.html?return_to=${encodeURIComponent('scan.html?facility_id=' + facilityId)}`;
      } else {
        window.location.href = "login.html";
      }
    } else {
      // 3. ONLY if logged in, do the fetch
      if (!facilityId) {
        document.getElementById("errorMessage").innerText = "Invalid QR Code.";
      } else {
        fetch(`/api/bookings/current-booking/${facilityId}/${user.id}`, {
          headers: {
            "Authorization": "Bearer " + localStorage.getItem("authToken")
          }
        })
          .then(res => res.json())
          .then(data => {
            if (data.success) {
              window.location.replace(`booking-details.html?id=${data.booking_id}&auto_checkin=true`);
            } else {
              document.getElementById("errorMessage").innerText = data.message;
            }
          })
          .catch(err => {
            document.getElementById("errorMessage").innerText = "System error. Please try again.";
          });
      }
    }
  </script>
</body>
</html>
