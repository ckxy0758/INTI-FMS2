<!DOCTYPE html>
<html>
<head>
  <title>Change Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-container">
    <h2>Change Password</h2>
    <p>You must change your temporary password before continuing.</p>

    <input type="password" id="newPassword" placeholder="New Password">

    <small style="display:block; color:#666; margin-bottom:12px;">
      Password must contain:
      <ul style="margin:5px 0 0 18px;">
        <li>At least 8 characters</li>
        <li>One uppercase letter (A-Z)</li>
        <li>One lowercase letter (a-z)</li>
        <li>One number (0-9)</li>
        <li>One special character (!@#$%^&*)</li>
      </ul>
    </small>

    <input type="password" id="confirmPassword" placeholder="Confirm Password">

    <button onclick="changePassword()">Change Password</button>

    <p id="message"></p>
  </div>

  <script>
  function changePassword() {
    const user =
      JSON.parse(localStorage.getItem("user")) ||
      JSON.parse(sessionStorage.getItem("user"));

    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const message = document.getElementById("message");

    message.innerText = "";

    if (!user) {
      window.location.href = "login.html";
      return;
    }

    if (!newPassword || !confirmPassword) {
      message.style.color = "red";
      message.innerText = "Please enter and confirm your new password";
      return;
    }

    const passwordRegex =
      /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>/?]).{8,}$/;

    if (!passwordRegex.test(newPassword)) {
      message.style.color = "red";
      message.innerHTML =
        "Password must contain:<br>" +
        "• At least 8 characters<br>" +
        "• One uppercase letter (A-Z)<br>" +
        "• One lowercase letter (a-z)<br>" +
        "• One number (0-9)<br>" +
        "• One special character (!@#$%^&*)";
      return;
    }

    if (newPassword !== confirmPassword) {
      message.style.color = "red";
      message.innerText = "Passwords do not match";
      return;
    }

    fetch("/api/change-password", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        user_id: user.id,
        newPassword: newPassword
      })
    })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          user.must_change_password = 0;

          if (localStorage.getItem("user")) {
            localStorage.setItem("user", JSON.stringify(user));
          } else {
            sessionStorage.setItem("user", JSON.stringify(user));
          }

          if (user.role === "student") {
            window.location.href = "student.html";
          } else if (user.role === "staff") {
            window.location.href = "staff.html";
          } else if (user.role === "admin") {
            window.location.href = "admin.html";
          }
        } else {
          message.style.color = "red";
          message.innerText = data.message;
        }
      })
      .catch(() => {
        message.style.color = "red";
        message.innerText = "Server connection failed";
      });
  }
</script>
</body>
</html>
