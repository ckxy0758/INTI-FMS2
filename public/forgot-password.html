<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"> 
</head>
<body class="login-page">

  <main class="login-hero">
    <div class="login-card">
      <h1>Reset Your Password</h1>
      <p>Enter your registered email address below.</p>

      <label>Email</label>
      <input type="email" id="email" placeholder="Enter your email" required>

      <button onclick="requestReset()">Send Reset Link</button>
      <p id="message"></p>
      
      <div style="margin-top: 15px;">
        <a href="login.html">Back to Login</a>
      </div>
    </div>
  </main>

  <script>
    function requestReset() {
      const email = document.getElementById("email").value;
      const message = document.getElementById("message");

      message.innerText = "";

      if (!email) {
        message.style.color = "#ffb4b4";
        message.innerText = "Please enter your email.";
        return;
      }

      // Hit the correct Express API endpoint
      fetch("/api/forgot-password", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email: email })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          message.style.color = "#22c55e"; // Green for success
          message.innerText = data.message;
        } else {
          message.style.color = "#ffb4b4"; // Red for error
          message.innerText = data.message;
        }
      })
      .catch(() => {
        message.style.color = "#ffb4b4";
        message.innerText = "Server connection failed.";
      });
    }
  </script>
</body>
</html>
