<!DOCTYPE html>
<html>
<head>
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-body">
  <!-- Testing 123 -->

  <!-- REUSABLE HEADER -->
  <div id="appHeader"></div>

  <!-- ===== MAIN LAYOUT ===== -->
  <div class="dashboard-layout">

    <!-- REUSABLE SIDEBAR -->
    <div id="appSidebar"></div>

    <!-- ===== CONTENT ===== -->
    <main class="main-content">

      <h1 class="page-title">
        Welcome to INTI Facilities Management System
      </h1>

      <p class="page-subtitle">
        Find your space now! Reserve equipment, studios, and more.
      </p>

      <!-- ===== FILTER BAR ===== -->
      <div class="filter-bar">

        <label>Filter By:</label>

        <input type="text" id="filterDate" placeholder="Select Date" readonly>

        <select id="filterType">
          <option value="">Facility Type</option>
          <option value="Laboratory">Laboratory</option>
          <option value="Sports Facility">Sports Facility</option>
          <option value="Study Space">Study Space</option>
          <option value="Music Facility">Music Facility</option>
          <option value="Other">Other</option>
        </select>

      </div>

      <!-- ===== FACILITY LIST ===== -->
      <div id="facilityList" class="facility-grid"></div>

    </main>

  </div>

  <!-- COMPONENT -->
  <script src="component.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <!-- ===== SCRIPT ===== -->
  <script>
    loadLayout("facilities");

    const user =
      JSON.parse(localStorage.getItem("user")) ||
      JSON.parse(sessionStorage.getItem("user"));

    if (!user || user.role !== "student") {
      window.location.href = "login.html";
    }

    let allFacilities = [];

    function isPastFilterDateTime(filterDate, filterTime) {
      if (!filterDate || !filterTime) return false;

      const selectedDateTime = new Date(`${filterDate}T${filterTime}`);
      const now = new Date();

      return selectedDateTime < now;
    }

    loadFacilities();

    function loadFacilities() {

      fetch(`/api/facilities?role=${user.role}`)

      .then(res => res.json())

      .then(data => {

        if (!data.success) {
          return;
        }

        allFacilities = data.facilities;

        renderFacilities(allFacilities);
      });
    }

    function renderFacilities(facilities) {

      const facilityList =
        document.getElementById("facilityList");

      facilityList.innerHTML = "";

      if (facilities.length === 0) {

        facilityList.innerHTML =
          "<p>No facilities found.</p>";

        return;
      }

      facilities.forEach(facility => {

        facilityList.innerHTML += `

          <div class="facility-card">

            <div class="facility-img">

              <img
                src="${facility.image_path || 'images/bg-image-2.jpeg'}"
                alt="${facility.facility_name}"
              >

              <span class="status-badge">
                Available Now
              </span>

            </div>

            <div class="facility-info">

              <h3>
                ${facility.facility_name}
              </h3>

              <p>

                <span class="facility-inline-icon">

                  <svg xmlns="http://www.w3.org/2000/svg"
                       height="24px"
                       viewBox="0 -960 960 960"
                       width="24px"
                       fill="currentColor">

                    <path d="m600-120-240-84-186 72q-20 8-37-4.5T120-170v-560q0-13 7.5-23t20.5-15l212-72 240 84 186-72q20-8 37 4.5t17 33.5v560q0 13-7.5 23T812-192l-212 72Zm-40-98v-468l-160-56v468l160 56Zm80 0 120-40v-474l-120 46v468Zm-440-10 120-46v-468l-120 40v474Zm440-458v468-468Zm-320-56v468-468Z"/>

                  </svg>

                </span>

                <span>
                  Location: ${facility.location}
                </span>

              </p>

              <p>

                <span class="facility-inline-icon">

                  <svg xmlns="http://www.w3.org/2000/svg"
                       height="24px"
                       viewBox="0 -960 960 960"
                       width="24px"
                       fill="currentColor">

                    <path d="M40-160v-112q0-34 17.5-62.5T104-378q62-31 126-46.5T360-440q66 0 130 15.5T616-378q29 15 46.5 43.5T680-272v112H40Zm720 0v-120q0-44-24.5-84.5T666-434q51 6 96 20.5t84 35.5q36 20 55 44.5t19 53.5v120H760ZM247-527q-47-47-47-113t47-113q47-47 113-47t113 47q47 47 47 113t-47 113q-47 47-113 47t-113-47Zm466 0q-47 47-113 47-11 0-28-2.5t-28-5.5q27-32 41.5-71t14.5-81q0-42-14.5-81T544-792q14-5 28-6.5t28-1.5q66 0 113 47t47 113q0 66-47 113ZM120-240h480v-32q0-11-5.5-20T580-306q-54-27-109-40.5T360-360q-56 0-111 13.5T140-306q-9 5-14.5 14t-5.5 20v32Zm296.5-343.5Q440-607 440-640t-23.5-56.5Q393-720 360-720t-56.5 23.5Q280-673 280-640t23.5 56.5Q327-560 360-560t56.5-23.5ZM360-240Zm0-400Z"/>

                  </svg>

                </span>

                <span>
                  Max. People:
                  ${facility.max_people || "-"}
                </span>

              </p>

              <p>

                <span class="facility-inline-icon">

                  <svg xmlns="http://www.w3.org/2000/svg"
                       height="24px"
                       viewBox="0 -960 960 960"
                       width="24px"
                       fill="currentColor">

                    <path d="M582-298 440-440v-200h80v167l118 118-56 57ZM440-720v-80h80v80h-80Zm280 280v-80h80v80h-80ZM440-160v-80h80v80h-80ZM160-440v-80h80v80h-80ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/>

                  </svg>

                </span>

                <span>
                  Time:
                  ${formatTime(facility.operating_start)}
                  -
                  ${formatTime(facility.operating_end)}
                </span>

              </p>

              <button
                onclick="
                window.location.href=
                'facility-details.html?id=${facility.facility_id}'
                "
              >
                View Details
              </button>

            </div>

          </div>

        `;
      });
    }

    /* ===== FILTERS ===== */

    document
      .getElementById("filterType")
      .addEventListener("change", applyFilters);

    function applyFilters() {

      const type =
        document.getElementById("filterType").value;

      let filtered = [...allFacilities];

      if (type) {

        filtered = filtered.filter(facility =>
          facility.facility_type === type
        );
      }

      renderFacilities(filtered);

      /*
      const date = document.getElementById("filterDate").value;
      const time = document.getElementById("filterTime").value;

      if (isPastFilterDateTime(date, time)) {
        alert("You cannot filter using a date or time that has already passed.");
        document.getElementById("filterTime").value = "";
        return;
      } */
    }

    /* ===== DATE PICKER ===== */
    flatpickr("#filterDate", {
    dateFormat: "d/m/Y",
    minDate: "today",
    defaultDate: "today",
    disableMobile: true,
    locale: { firstDayOfWeek: 1 },
    onOpen: function(selectedDates, dateStr, instance) {
    setTimeout(function() {
      const cal = instance.calendarContainer;
      const input = document.getElementById("filterDate");
      const rect = input.getBoundingClientRect();
      cal.style.position = "fixed";
      cal.style.top = (rect.bottom + 6) + "px";
      cal.style.left = rect.left + "px";
      cal.style.zIndex = "9999";
    }, 0);
  },
    onReady: function(selectedDates, dateStr, instance) {
      const cal = instance.calendarContainer;
      cal.style.zIndex = "9999";

      const monthsEl = cal.querySelector(".flatpickr-months");
      const prevBtn = cal.querySelector(".flatpickr-prev-month");
      const nextBtn = cal.querySelector(".flatpickr-next-month");
      monthsEl.insertBefore(prevBtn, monthsEl.firstChild);
      monthsEl.appendChild(nextBtn);

      const bottomRow = document.createElement("div");
      bottomRow.className = "fp-bottom-row";
      bottomRow.innerHTML = `
        <button class="fp-cancel-btn" type="button">Cancel</button>
        <button class="fp-apply-btn" type="button">Today</button>
      `;
      cal.appendChild(bottomRow);

      bottomRow.querySelector(".fp-cancel-btn").addEventListener("click", () => {
        instance.clear();
        instance.close();
        applyFilters();
      });

      bottomRow.querySelector(".fp-apply-btn").addEventListener("click", () => {
      instance.setDate(new Date());
      instance.close();
      applyFilters();
    });
    },
    onChange: function(selectedDates, dateStr, instance) {
    }
  });

    window.addEventListener("scroll", function() {
    const fp = document.getElementById("filterDate")._flatpickr;
    if (fp) fp.close();
  }, true);
    /* ===== TIME FORMAT ===== */

    function formatTime(time) {

      const [hour, minute] = time.split(":");

      let h = parseInt(hour);

      const ampm =
        h >= 12 ? "PM" : "AM";

      h = h % 12;

      if (h === 0) h = 12;

      return `${h}:${minute} ${ampm}`;
    }

    /* ===== LOGOUT ===== */

    function logout() {

      localStorage.removeItem("user");

      sessionStorage.removeItem("user");

      window.location.href = "login.html";
    }

    

  </script>

</body>
</html>
