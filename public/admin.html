<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Basic page setup -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Page title shown on browser tab -->
  <title>Admin Dashboard</title>

  <!-- Google Font: Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Main CSS file -->
  <link rel="stylesheet" href="style.css" />

  <!-- Font Awesome icons for dashboard KPI cards -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <!-- Chart.js library for facility usage bar chart -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="dashboard-body">

  <!-- Header component will be loaded dynamically from component.js -->
  <div id="appHeader"></div>

  <div class="dashboard-layout">

    <!-- Sidebar component will be loaded dynamically from component.js -->
    <div id="appSidebar"></div>

    <!-- Main dashboard content area -->
    <main class="main-content">
      <section class="admin-dashboard">

        <!-- Dashboard page title -->
        <h1 class="page-title">Welcome Back, Admin!</h1>
        <p class="page-subtitle">
          Manage our INTI Facilities easily!
        </p>

        <!-- KPI section showing important dashboard summary values -->
        <div class="dashboard-kpi-row">

          <!-- KPI card: number of bookings waiting for admin approval -->
          <div class="kpi-card" id="card-pending">
            <div class="kpi-content">
              <span>Pending Approval</span>
              <strong id="kpiPending">0</strong>
            </div>
            <div class="kpi-icon-container"><i class="fas fa-clock"></i></div>
          </div>

          <!-- KPI card: total number of active users -->
          <div class="kpi-card" id="card-users">
            <div class="kpi-content">
              <span>Active Users</span>
              <strong id="kpiUsers">0</strong>
            </div>
            <div class="kpi-icon-container"><i class="fas fa-users"></i></div>
          </div>

          <!-- KPI card: total number of facilities in the system -->
          <div class="kpi-card" id="card-facilities">
            <div class="kpi-content">
              <span>Total Facilities</span>
              <strong id="kpiFacilities">0</strong>
            </div>
            <div class="kpi-icon-container"><i class="fas fa-building"></i></div>
          </div>

          <!-- KPI card: number of facility keys that have not been returned -->
          <div class="kpi-card" id="card-keys">
            <div class="kpi-content">
              <span>Keys Not Returned</span>
              <strong id="kpiKeys">0</strong>
            </div>
            <div class="kpi-icon-container"><i class="fas fa-key"></i></div>
          </div>
        </div>

        <!-- Top row contains latest booking requests and facility usage chart -->
        <div class="admin-top-row">

          <!-- Latest booking requests table -->
          <div class="report-card">
            <div class="card-header">
              <h3>Latest Requests <span id="badgeRequests" class="badge">0</span></h3>

              <!-- Redirect admin to full Manage Bookings page -->
              <button onclick="window.location.href='manage-bookings.html'" class="btn-view-all">View All</button>
            </div>

            <div class="card-body" style="overflow-x: auto;">
              <table style="min-width: 250px;">
                <thead>
                  <tr>
                    <th>User</th>
                    <th>Facility</th>
                    <th>Status</th>
                  </tr>
                </thead>

                <!-- Recent booking records will be inserted here using JavaScript -->
                <tbody id="recentBookingsBody"></tbody>
              </table>
            </div>
          </div>

          <!-- Facility usage chart section -->
          <div class="report-card chart-card">
            <div class="card-header">
              <h3>Facility Usage</h3>

              <!-- Redirect admin to full Reports page -->
              <button onclick="window.location.href='reports.html'" class="btn-view-all">Full Reports</button>
            </div>

            <!-- Chart.js canvas for displaying facility booking usage -->
            <div class="card-body" style="position: relative; min-height: 250px;">
              <canvas id="dashboardChart"></canvas>
            </div>
          </div>
        </div>

        <!-- Bottom row contains recent admin notifications -->
        <div class="admin-bottom-row">
          <div class="report-card" style="width: 100%;">
            <div class="card-header">
              <h3>Notifications <span id="badgeNotifs" class="badge">0</span></h3>

              <!-- Redirect admin to full Notifications page -->
              <button onclick="window.location.href='notifications.html'" class="btn-view-all">View All</button>
            </div>

            <!-- Recent notifications will be inserted here using JavaScript -->
            <div class="card-body" id="dashboardNotifications" style="overflow-y: auto; max-height: 250px;"></div>
          </div>
        </div>

      </section>
    </main>
  </div>

  <!-- Shared layout script for loading header and sidebar -->
  <script src="component.js"></script>

  <script>
    // Load the admin dashboard layout, including header and sidebar
    loadLayout("admin-dashboard");

    // Get logged-in user data from localStorage or sessionStorage
    const user = JSON.parse(localStorage.getItem("user")) || JSON.parse(sessionStorage.getItem("user"));

    // Protect this page so only admin users can access it
    // If the user is not logged in or is not an admin, redirect to login page
    if (!user || user.role !== "admin") {
      window.location.href = "login.html";
    }

    // Store the Chart.js instance so it can be destroyed before re-rendering
    let dashChart;

    // Fetch dashboard data after the page content has fully loaded
    document.addEventListener("DOMContentLoaded", () => {
      fetchDashboardData();
    });

    /**
     * Fetch dashboard summary data from the backend API.
     * This includes:
     * - KPI values
     * - Recent booking requests
     * - Recent notifications
     * - Facility usage data for the chart
     */
    function fetchDashboardData() {
      fetch(`/api/admin/dashboard?userId=${user.id}`, {
        headers: {
          // Send JWT token for backend authentication
          "Authorization": "Bearer " + localStorage.getItem("authToken")
        }
      })
        .then(res => res.json())
        .then(data => {
          // Stop if the backend response is not successful
          if (!data.success) {
            console.error("Failed to fetch dashboard data:", data.message);
            return;
          }

          // 1. Populate KPI cards and notification badges
          const pendingCount = data.kpis.pendingBookings || 0;

          // Show pending booking count
          document.getElementById("kpiPending").textContent = pendingCount;
          document.getElementById("badgeRequests").textContent = pendingCount; 
          
          // Show active users, total facilities, and unreturned keys
          document.getElementById("kpiUsers").textContent = data.kpis.activeUsers || 0;
          document.getElementById("kpiFacilities").textContent = data.kpis.totalFacilities || 0;
          document.getElementById("kpiKeys").textContent = data.kpis.unreturnedKeys || 0;

          // Show unread notification count
          document.getElementById("badgeNotifs").textContent = data.kpis.unreadNotifications || 0;

          // 2. Populate recent bookings table
          const tbody = document.getElementById("recentBookingsBody");
          tbody.innerHTML = "";

          // Display empty message if there are no recent bookings
          if (data.recentBookings.length === 0) {
            tbody.innerHTML = "<tr><td colspan='3' style='text-align: center; color: #9ca3af; padding: 20px;'>No recent bookings</td></tr>";
          } else {
            // Insert each recent booking into the table
            data.recentBookings.forEach(b => {
              tbody.innerHTML += `
                <tr>
                  <td>${b.user_name}</td>
                  <td>${b.facility_name}</td>
                  <td><span style="font-weight: 500;">${formatStatus(b.booking_status)}</span></td>
                </tr>
              `;
            });
          }

          // 3. Populate recent notifications section
          const notifDiv = document.getElementById("dashboardNotifications");
          notifDiv.innerHTML = "";

          // Display empty message if there are no recent notifications
          if (data.recentNotifications.length === 0) {
            notifDiv.innerHTML = "<p style='padding: 10px 0; color: #9ca3af;'>No recent notifications.</p>";
          } else {
            // Insert each notification item into the dashboard
            data.recentNotifications.forEach(n => {
              const dateObj = new Date(n.created_at);

              // Format notification date and time for easier reading
              const formattedDate = dateObj.toLocaleDateString() + ' ' + dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
              
              notifDiv.innerHTML += `
                <div class="notif-item">
                  <div class="notif-title">${n.title}</div>
                  <div class="notif-date">${formattedDate}</div>
                  <div class="notif-msg">${n.message}</div>
                </div>
              `;
            });
          }

          // 4. Render facility usage bar chart
          renderChart(data.facilityUsage);
        })
        .catch(err => console.error("Error loading dashboard:", err));
    }

    /**
     * Render the facility usage chart using Chart.js.
     * The chart displays the total number of bookings for each facility.
     */
    function renderChart(usageData) {
      // Extract facility names for chart labels
      const labels = usageData.map(d => d.facility_name);

      // Extract total booking values for each facility
      const values = usageData.map(d => Number(d.total_bookings));

      // Destroy previous chart before creating a new one to prevent duplication
      if (dashChart) dashChart.destroy();

      // Create bar chart for facility usage
      dashChart = new Chart(document.getElementById("dashboardChart"), {
        type: "bar",
        data: {
          labels: labels,
          datasets: [{
            label: "Total Bookings",
            data: values,
            backgroundColor: "#3f63d8",
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { 
            legend: { display: false } 
          },
          scales: { 
            y: { 
              beginAtZero: true, 
              ticks: { precision: 0 } 
            } 
          }
        }
      });
    }

    /**
     * Convert booking status text into a more readable format.
     * Example:
     * "pending_approval" becomes "Pending Approval"
     */
    function formatStatus(val) {
      if (!val) return "-";
      return val.replaceAll("_", " ").replace(/\b\w/g, c => c.toUpperCase());
    }
  </script>
</body>
</html>
