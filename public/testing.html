<!DOCTYPE html>
<html>
<head>
  <title>Student Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

<body class="dashboard-body">

  <!-- ===== HEADER ===== -->

      <div class="menu-icon">☰</div>

      <div class="logo-text">
        <span class="logo-star">✱</span> INTI

    </div>
  </header>

    <!-- ===== CONTENT ===== -->
    <main class="main-content">

      <h1 class="page-title">
        Welcome to INTI Facilities Management System
      </h1>

      <p class="page-subtitle">
        Find your space now! Reserve equipment, studios, and more.
      </p>

      <!-- ===== FILTER BAR ===== -->
      <div class="filter-bar">

        <label>Filter By:</label>

        <input type="date" id="filterDate">

        <input type="time" id="filterTime">

        <select id="filterType">
          <option value="">Facility Type</option>
          <option value="lab">Lab</option>
          <option value="classroom">Classroom</option>
          <option value="meeting_room">Meeting Room</option>
          <option value="studio">Studio</option>
          <option value="sports_facility">Sports Facility</option>
          <option value="event_space">Event Space</option>
          <option value="others">Others</option>
        </select>

      </div>

      <!-- ===== FACILITY LIST ===== -->
      <div id="facilityList" class="facility-grid"></div>

    </main>

  </div>
