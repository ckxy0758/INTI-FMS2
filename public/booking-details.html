<!DOCTYPE html>
<html>
<head>
  <title>Booking Details</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-body">

  <div id="appHeader"></div>

  <div class="dashboard-layout">
    <div id="appSidebar"></div>

    <main class="main-content">

      <h1 class="page-title">Booking Details</h1>
      <p class="page-subtitle">View your booking information and status.</p>


      <div class="booking-details-layout">
        <div class="booking-detail-card" id="bookingLeftCard">
          Loading booking details...
        </div>

        <div class="booking-action-card" id="bookingRightCard">
          Loading action...
        </div>
      </div>

    </main>
  </div>

  <script src="component.js"></script>

  <script>
    const source = new URLSearchParams(window.location.search).get("source");

    // Determine which sidebar tab should be highlighted based on the URL
    let activeSidebarMenu = "activities"; 

    if (source === "key-management") {
      activeSidebarMenu = "key-management";
    } else if (source === "manage-bookings") {
      activeSidebarMenu = "manage-bookings";
    }

    loadLayout(activeSidebarMenu);
    
    // 1. Authenticate User
    const user =
      JSON.parse(localStorage.getItem("user")) ||
      JSON.parse(sessionStorage.getItem("user"));

    if (!user) {
      window.location.href = "login.html";
    }

    // 2. Read the Booking ID from the URL
    const params = new URLSearchParams(window.location.search);
    const bookingId = params.get("id");

    if (!bookingId) {
      window.location.href = user.role === "admin" ? "admin.html" : "activities.html";
    }

    let currentBooking = null;

    loadBookingDetails();

    // 3. Fetch Data  
    function loadBookingDetails() {
      fetch(`/api/bookings/${bookingId}`, {
        headers: {
          "Authorization": "Bearer " + localStorage.getItem("authToken")
        }
      })
        .then(res => res.json())
        .then(data => {
          if (!data.success) {
            alert(data.message);
            window.location.href = "activities.html";
            return;
          }

          currentBooking = data.booking;
          renderBookingDetails(currentBooking);
          renderActionPanel(currentBooking);

          // --- NEW: AUTO CHECK-IN & KEY RETURN LOGIC ---
          const autoCheckin = params.get("auto_checkin");
          if (autoCheckin === "true") {
            // Remove parameter from URL so it doesn't loop if page is refreshed
            window.history.replaceState(null, '', window.location.pathname + '?id=' + bookingId);

            const status = currentBooking.booking_status ? currentBooking.booking_status.trim().toLowerCase() : "";

            if (currentBooking.booking_flow_type === "direct_reservation" && (status === "reserved" || status === "pending")) {
              checkInCubicle();
            } 
            else if ((currentBooking.booking_flow_type === "staff_key_approval" || currentBooking.booking_flow_type === "normal_approval") && status === "key_collected") {
              returnKey(); // Automatically triggers the key return pop-up
            }
          }
          // --- END NEW LOGIC ---

        })
        .catch(() => {
          alert("Failed to load booking details.");
        });
    }

    // 4. Render Left Side (Information)
    function renderBookingDetails(booking) {
      document.getElementById("bookingLeftCard").innerHTML = `
        <div class="booking-detail-header">
          <h2>Booking ID: #${String(booking.booking_id).padStart(3, "0")}</h2>
          <span class="booking-status-badge">${formatStatus(booking)}</span>
        </div>

        <img
          src="${booking.image_path || 'images/bg-image-2.jpeg'}"
          class="booking-detail-image"
          alt="${booking.facility_name}"
        >

        <h2>${booking.facility_name}</h2>
        <p class="booking-detail-desc">${booking.description || ""}</p>

        <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 18px 0;">
        <p style="font-weight: 700; font-size: 18px; margin: 0 0 4px 0; color: #D12E26;">Summary</p>        
        <div class="booking-detail-info-grid">
          <p><strong style="color:#D12E26; font-size: 16px; font-weight: 600; min-width:95px; flex-shrink:0; ">Facility:</strong> <span style="font-size:14px;"> ${booking.facility_name}</p>
          <p><strong style="color:#D12E26; font-size: 16px; font-weight: 600; min-width:95px; flex-shrink:0; ">Location:</strong> <span style="font-size:14px;"> ${booking.location}</p>
          <p><strong style="color:#D12E26; font-size: 16px; font-weight: 600; min-width:95px; flex-shrink:0; ">Date:</strong> <span style="font-size:14px;"> ${formatDate(booking.booking_date)}</p>
          <p><strong style="color:#D12E26; font-size: 16px; font-weight: 600; min-width:95px; flex-shrink:0; ">Time:</strong> <span style="font-size:14px;"> ${formatTime(booking.start_time)} - ${formatTime(booking.end_time)}</p>
          <p><strong style="color:#D12E26; font-size: 16px; font-weight: 600; min-width:95px; flex-shrink:0; ">Duration:</strong> <span style="font-size:14px;"> ${booking.duration_hours} hour(s)</p>
          <p><strong style="color:#D12E26; font-size: 16px; font-weight: 600; min-width:95px; flex-shrink:0; ">Status:</strong> <span style="font-size:14px;"> ${formatStatus(booking)}</p>
        </div>

        <div class="booking-purpose-box">
          <p style="font-weight: 700; font-size: 18px; margin: 0 0 4px 0; color: #D12E26;">Purpose</p>  
          <p>${booking.purpose || "-"}</p>
        </div>
      `;
    }

    // 5. Render Right Side (Action Buttons)
    function renderActionPanel(booking) {
      const card = document.getElementById("bookingRightCard");
      const status = booking.booking_status ? booking.booking_status.trim().toLowerCase() : "";

      // ADMIN SPECIFIC LOGIC 
      if (user.role === "admin") {
        let backButtonHtml = `<button class="action-secondary-btn full-width-btn" style="margin-top: 15px;" onclick="window.history.back()">Go Back</button>`;
        
        if (source === "key-management") {
          backButtonHtml = `<button class="action-secondary-btn full-width-btn" style="margin-top: 15px;" onclick="window.location.href='key-management.html'">Back to Key Management</button>`;
        } else if (source === "manage-bookings") {
          backButtonHtml = `<button class="action-secondary-btn full-width-btn" style="margin-top: 15px;" onclick="window.location.href='manage-bookings.html'">Back to Manage Bookings</button>`;
        }

        card.innerHTML = `
          <h2>Admin Record View</h2>
          <p>You are viewing this booking record as a system administrator.</p>

          <div class="action-box">
            <strong>Current Status</strong>
            <h3>${formatStatus(booking)}</h3>
          </div>

          ${backButtonHtml}
        `;
        return; 
      }

      // STUDENT / STAFF LOGIC

      // Cubicle Flow
      if (booking.booking_flow_type === "direct_reservation") {
        const canCheckIn = isWithinCheckInWindow(booking);

        card.innerHTML = `
          <h2>Cubicle Check In</h2>
          <p>Please scan the QR code located at your cubicle to check in.</p>

          <div class="action-box">
            <strong>Check-in Window</strong>
            <h3>${getCheckInStartTime(booking)} - ${getCheckInEndTime(booking)}</h3>
            <p>For ${formatTime(booking.start_time)} booking</p>
          </div>

          <p><strong>Current Status:</strong> ${formatStatus(booking)}</p>

          ${
            status === "reserved" || status === "pending"
              ? canCheckIn
                ? `<button class="action-main-btn full-width-btn" disabled style="opacity:0.6; cursor:not-allowed;" title="Please use the QR scanner">Check In (Scan QR Code)</button>`
                : `<button class="action-main-btn full-width-btn" disabled style="opacity:0.5; cursor:not-allowed;">Check In Not Available Yet</button>`
              : ""
          }

          <button class="action-secondary-btn full-width-btn" style="margin-top: 15px;" onclick="window.location.href='activities.html'">
            Back to Activities
          </button>
        `;
        return;
      }

      // Key Approval Flow (UPDATED FOR SCANNER)
      if (booking.booking_flow_type === "staff_key_approval" || booking.booking_flow_type === "normal_approval") {
          card.innerHTML = `
          <h2>Key Return</h2>
          <p>Please scan the QR code at the facility desk to return the key.</p>

          <div class="action-box">
            <strong>Current Status</strong>
            <h3>${formatStatus(booking)}</h3>
          </div>

          ${
            status === "key_collected"
              ? `<button class="action-main-btn full-width-btn" disabled style="opacity:0.6; cursor:not-allowed;" title="Please use the QR scanner">Return Key (Scan QR Code)</button>`
              : status === "completed"
                ? `<button class="action-main-btn full-width-btn" disabled style="opacity:0.5; cursor:not-allowed;">Key Already Returned</button>`
                : `<button class="action-main-btn full-width-btn" disabled style="opacity:0.5; cursor:not-allowed;">Return Key Not Available Yet</button>`
          }

          <button class="action-secondary-btn full-width-btn" style="margin-top: 15px;" onclick="window.location.href='activities.html'">
            Back to Activities
          </button>
        `;
        return;
      }

      // Default Pending Flow
      card.innerHTML = `
        <h2>Booking Status</h2>
        <p>Your booking request is being processed.</p>

        <div class="action-box">
          <strong>Status</strong>
          <h3>${formatStatus(booking)}</h3>
        </div>

        <button class="action-secondary-btn full-width-btn" style="margin-top: 15px;" onclick="window.location.href='activities.html'">
          Back to Activities
        </button>
      `;
    }

    // 6. Action Functions
    function checkInCubicle() {
      fetch(`/api/bookings/${bookingId}/check-in`, {
        method: "PUT",
        headers: { 
          "Content-Type": "application/json",
          "Authorization": "Bearer " + localStorage.getItem("authToken")
        },
        body: JSON.stringify({ user_id: user.id })
      })
      .then(res => res.json())
      .then(data => {
        showAlert(data.message, data.success ? "success" : "error", data.success ? () => loadBookingDetails() : null);
      })
      .catch(() => {
        showAlert("Check-in failed. Please try again.", "error");
      });
    }

    function returnKey() {
    fetch(`/api/bookings/${bookingId}/return-key`, {
        method: "PUT",
        headers: { 
          "Content-Type": "application/json",
          "Authorization": "Bearer " + localStorage.getItem("authToken")
        },
        body: JSON.stringify({ user_id: user.id })
      })
      .then(res => res.json())
      .then(data => {
        showAlert(data.message, data.success ? "success" : "error", data.success ? () => loadBookingDetails() : null);
      })
      .catch(() => {
        showAlert("Key return failed. Please try again.", "error");
      });
    }

    // 7. Utility Functions
    function formatStatus(booking) {
      const bookingStatus = booking.booking_status ? booking.booking_status.trim().toLowerCase() : "";
      const paymentStatus = booking.payment_status ? booking.payment_status.trim().toLowerCase() : "";

      if (booking.booking_flow_type === "direct_reservation") {
        if (bookingStatus === "reserved") return "Cubicle Reserved";
        if (bookingStatus === "checked_in") return "Checked In";
        if (bookingStatus === "expired") return "Reservation Expired";
        if (bookingStatus === "completed") return "Completed";
      }

    if (booking.booking_flow_type === "staff_key_approval" || booking.booking_flow_type === "normal_approval") {
        if (bookingStatus === "pending") return "Submitted";
        if (bookingStatus === "approved") return "Approved";
        if (bookingStatus === "key_collected") return "Key Collected";
        if (bookingStatus === "completed") return "Returned";
      }

      if (booking.payment_required === 1 || booking.payment_required === "1") {
        if (paymentStatus === "pending_payment") return "Pending Payment";
        if (paymentStatus === "payment_submitted") return "Payment Submitted";
        if (paymentStatus === "verified") return "Payment Verified";
      }

      if (bookingStatus === "pending") return "Pending";
      if (bookingStatus === "approved") return "Approved";
      if (bookingStatus === "rejected") return "Rejected";
      if (bookingStatus === "cancelled") return "Cancelled";
      if (bookingStatus === "completed") return "Completed";

      return "Unknown";
    }

    function isWithinCheckInWindow(booking) {
      const startDateTime = new Date(`${booking.booking_date}T${booking.start_time}`);
      const createdAt = new Date(booking.created_at);
      
      const baseTime = createdAt > startDateTime ? createdAt : startDateTime;

      const checkInStart = new Date(baseTime);
      checkInStart.setMinutes(checkInStart.getMinutes() - 15);
      const checkInEnd = new Date(baseTime);
      checkInEnd.setMinutes(checkInEnd.getMinutes() + 15);
      
      const now = new Date();
      return now >= checkInStart && now <= checkInEnd;
    }

    function getCheckInStartTime(booking) {
      const startDateTime = new Date(`${booking.booking_date}T${booking.start_time}`);
      const createdAt = new Date(booking.created_at);
      const baseTime = createdAt > startDateTime ? createdAt : startDateTime;

      baseTime.setMinutes(baseTime.getMinutes() - 15);
      return formatTimeFromDate(baseTime);
    }

    function getCheckInEndTime(booking) {
      const startDateTime = new Date(`${booking.booking_date}T${booking.start_time}`);
      const createdAt = new Date(booking.created_at);
      const baseTime = createdAt > startDateTime ? createdAt : startDateTime;

      baseTime.setMinutes(baseTime.getMinutes() + 15);
      return formatTimeFromDate(baseTime);
    }

    function formatTimeFromDate(date) {
      let h = date.getHours();
      const minute = String(date.getMinutes()).padStart(2, "0");
      const ampm = h >= 12 ? "PM" : "AM";
      h = h % 12;
      if (h === 0) h = 12;
      return `${h}:${minute} ${ampm}`;
    }

    function formatDate(dateValue) {
      return new Date(dateValue).toLocaleDateString("en-MY", {
        day: "2-digit", month: "short", year: "numeric"
      });
    }

    function formatTime(time) {
      const [hour, minute] = time.split(":");
      let h = parseInt(hour);
      const ampm = h >= 12 ? "PM" : "AM";
      h = h % 12;
      if (h === 0) h = 12;
      return `${h}:${minute} ${ampm}`;
    }

    function logout() {
      localStorage.removeItem("user");
      sessionStorage.removeItem("user");
      window.location.href = "login.html";
    }

    function showAlert(message, type, onClose) {
      document.getElementById("modalIcon").innerHTML = type === "success"
        ? `<div style="width:44px;height:44px;background:#dcfce7;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto;"><svg xmlns="http://www.w3.org/2000/svg" height="36px" viewBox="0 -960 960 960" width="36px" fill="#22c55e"><path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z"/></svg></div>`
        : `<div style="width:44px;height:44px;background:#fee2e2;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto;"><svg xmlns="http://www.w3.org/2000/svg" height="36px" viewBox="0 -960 960 960" width="36px" fill="#D12E26"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg></div>`;
      document.getElementById("modalTitle").innerText = type === "success" ? "Success" : "Error";
      document.getElementById("modalTitle").style.color = "#D12E26";
      document.getElementById("modalTitle").style.fontSize = "24px";
      document.getElementById("modalMessage").innerText = message;
      document.getElementById("modalMessage").style.fontSize = "16px";
      document.getElementById("modalButtons").innerHTML = `
        <button onclick="closeModal('cb')" class="custom-modal-btn-ok">OK</button>
      `;
      if (onClose) window._modalCallback = onClose;
      document.getElementById("customModal").style.display = "flex";
    }

    function closeModal(cb) {
      document.getElementById("customModal").style.display = "none";
      if (cb === 'cb' && window._modalCallback) { window._modalCallback(); window._modalCallback = null; }
    }

  </script>

<div id="customModal" class="custom-modal-overlay">
    <div class="custom-modal-box">
      <div id="modalIcon" class="custom-modal-icon"></div>
      <h3 id="modalTitle" class="custom-modal-title"></h3>
      <p id="modalMessage" class="custom-modal-message"></p>
      <div id="modalButtons" class="custom-modal-buttons"></div>
    </div>
  </div>

</body>
</html>
