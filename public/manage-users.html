<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Users</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-body">

  <div id="appHeader"></div>

  <div class="dashboard-layout">

    <div id="appSidebar"></div>

    <main class="main-content">

      <h1 class="page-title">Manage Users</h1>
      <p class="page-subtitle">View, audit, and manage user access permissions.</p>

      <div class="manage-user-tabs">
        <button class="user-tab active" onclick="filterUsers('all', event)">All</button>
        <button class="user-tab" onclick="filterUsers('student', event)">Students</button>
        <button class="user-tab" onclick="filterUsers('staff', event)">Staff</button>
        <button class="user-tab" onclick="filterUsers('admin', event)">Admins</button>
      </div>

      <div class="manage-user-toolbar">
        <div class="user-search-box">
          <input 
            type="text" 
            id="userSearch" 
            placeholder="Search by name or ID..."
            onkeyup="searchUsers()"
          >
        </div>

        <button class="add-user-btn" onclick="openCreateModal()">
          + Add New User
        </button>
      </div>

      <div class="user-table-card">
        <table class="manage-user-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>ID</th>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="userTable"></tbody>
        </table>
      </div>

      <p id="userCount" class="user-count-text"></p>

    </main>

  </div>

  <div id="createUserModal" class="modal-overlay">
    <div class="create-user-modal">

      <button class="modal-close-btn" onclick="closeCreateModal()">×</button>

      <h2>Quick Create Account</h2>
      <p>Add new student, staff, or admin account</p>

      <label>Full Name</label>
      <input type="text" id="name" placeholder="Enter full name">

      <label>Student ID / Staff ID</label>
      <input type="text" id="user_code" placeholder="Enter student ID or staff ID">

      <label>Institutional Email</label>
      <input type="email" id="email" placeholder="Enter institutional email">

      <label>Account Role</label>
      <select id="role">
        <option value="student">Student</option>
        <option value="staff">Staff</option>
        <option value="admin">Admin</option>
      </select>

      <button class="create-account-btn" onclick="createUser()">
        Create Account Now
      </button>

      <p id="message"></p>

    </div>
  </div>

  <script src="component.js"></script>

  <script>
    loadLayout("manage-users");

    const user =
      JSON.parse(localStorage.getItem("user")) ||
      JSON.parse(sessionStorage.getItem("user"));

    if (!user || user.role !== "admin") {
      window.location.href = "login.html";
    }

    let allUsers = [];
    let currentRoleFilter = "all";

    loadUsers();

    function openCreateModal() {
      document.getElementById("createUserModal").style.display = "flex";
      document.getElementById("message").innerText = "";
    }

    function closeCreateModal() {
      document.getElementById("createUserModal").style.display = "none";
    }

    function createUser() {
      const name = document.getElementById("name").value.trim();
      const user_code = document.getElementById("user_code").value.trim();
      const email = document.getElementById("email").value.trim();
      const role = document.getElementById("role").value;
      const message = document.getElementById("message");

      if (!name || !user_code || !email || !role) {
        message.style.color = "red";
        message.innerText = "Please fill in all fields.";
        return;
      }

    fetch("/api/users", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + localStorage.getItem("authToken")
        },
        body: JSON.stringify({
          name,
          user_code,
          email,
          role
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          message.style.color = "green";
          message.innerText = data.message;

          document.getElementById("name").value = "";
          document.getElementById("user_code").value = "";
          document.getElementById("email").value = "";
          document.getElementById("role").value = "student";

          loadUsers();

          setTimeout(() => {
            closeCreateModal();
          }, 1000);

        } else {
          message.style.color = "red";
          message.innerText = data.message;
        }
      })
      .catch(() => {
        message.style.color = "red";
        message.innerText = "Failed to create user.";
      });
    }

    function loadUsers() {
    fetch("/api/users", {
        headers: {
          "Authorization": "Bearer " + localStorage.getItem("authToken")
        }
      })        .then(res => res.json())
        .then(data => {
          if (!data.success) {
            document.getElementById("userTable").innerHTML = `
              <tr>
                <td colspan="6">Failed to load users.</td>
              </tr>
            `;
            return;
          }

          allUsers = data.users;
          applyFilters();
        });
    }

    function filterUsers(role, event) {
      currentRoleFilter = role;

      document.querySelectorAll(".user-tab").forEach(tab => {
        tab.classList.remove("active");
      });

      event.target.classList.add("active");

      applyFilters();
    }

    function searchUsers() {
      applyFilters();
    }

    function applyFilters() {
      const searchValue = document.getElementById("userSearch").value.toLowerCase();

      let filteredUsers = allUsers.filter(item => {
        const matchRole =
          currentRoleFilter === "all" ||
          item.role.toLowerCase() === currentRoleFilter;

        const matchSearch =
          item.name.toLowerCase().includes(searchValue) ||
          item.user_code.toLowerCase().includes(searchValue);

        return matchRole && matchSearch;
      });

      renderUsers(filteredUsers);
    }

    function renderUsers(users) {
      const userTable = document.getElementById("userTable");
      const userCount = document.getElementById("userCount");

      userTable.innerHTML = "";

      if (users.length === 0) {
        userTable.innerHTML = `
          <tr>
            <td colspan="6">No users found.</td>
          </tr>
        `;

        userCount.innerText = "Showing 0 users";
        return;
      }

      users.forEach(item => {
        const statusClass =
          item.status === "active" ? "status-active" : "status-inactive";

        userTable.innerHTML += `
          <tr>
            <td>${item.name}</td>
            <td>${item.user_code}</td>
            <td>${item.email}</td>
            <td>${formatRole(item.role)}</td>
            <td class="${statusClass}">${formatStatus(item.status)}</td>
            <td>
              ${
                item.status === "active"
                  ? `<button class="text-action-btn danger" onclick="deactivateUser(${item.user_id})">Deactivate</button>`
                  : `<button class="text-action-btn success" onclick="reactivateUser(${item.user_id})">Reactivate</button>`
              }
            </td>
          </tr>
        `;
      });

      userCount.innerText = `Showing ${users.length} of ${allUsers.length} users`;
    }

    function formatRole(role) {
      if (role === "student") return "Student";
      if (role === "staff") return "Staff";
      if (role === "admin") return "Admin";
      return role;
    }

    function formatStatus(status) {
      if (status === "active") return "Active";
      if (status === "inactive") return "Inactive";
      return status;
    }

    function showAlert(message, type) {
      document.getElementById("modalIcon").innerHTML = type === "success"
      ? `<div style="width:44px; height:44px; background:#dcfce7; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px;"><svg xmlns="http://www.w3.org/2000/svg" height="36px" viewBox="0 -960 960 960" width="36px" fill="#22c55e"><path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z"/></svg></div>`
      : `<div style="width:44px; height:44px; background:#fee2e2; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px;"><svg xmlns="http://www.w3.org/2000/svg" height="36px" viewBox="0 -960 960 960" width="36px" fill="#D12E26"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg></div>`;
      document.getElementById("modalTitle").innerText = type === "success" ? "Success" : "Error";
      document.getElementById("modalMessage").innerText = message;
      document.getElementById("modalButtons").innerHTML = `
        <button onclick="closeModal()" style="padding:10px 28px; background:#D12E26; color:#fff; border:none; border-radius:8px; font-weight:600; cursor:pointer; font-family:'Poppins',sans-serif;">OK</button>
      `;
      document.getElementById("customModal").style.display = "flex";
    }

    function showConfirm(message, onConfirm) {
      document.getElementById("modalIcon").innerHTML = `<div style="width:44px; height:44px; background:#fef3c7; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:32px; font-weight:800; color:#f59e0b;">!</div>`;      document.getElementById("modalTitle").innerText = "Confirmation";
      document.getElementById("modalTitle").style.color = "#D12E26";
      document.getElementById("modalTitle").style.fontSize = "24px";
      document.getElementById("modalTitle").style.marginBottom = "6px";
      document.getElementById("modalTitle").style.marginTop = "-8px";
      document.getElementById("modalMessage").innerText = message;
      document.getElementById("modalMessage").style.fontSize = "16px";
      document.getElementById("modalMessage").style.marginBottom = "24px";
      document.getElementById("modalButtons").innerHTML = `
        <button onclick="closeModal()" style="padding:10px 28px; background:#fff; color:#374151; border:1.5px solid #e5e7eb; border-radius:8px; font-weight:600; cursor:pointer; font-family:'Poppins',sans-serif;">Cancel</button>
        <button id="confirmBtn" style="padding:10px 28px; background:#D12E26; color:#fff; border:none; border-radius:8px; font-weight:600; cursor:pointer; font-family:'Poppins',sans-serif;">Confirm</button>
      `;
      document.getElementById("confirmBtn").onclick = () => { closeModal(); onConfirm(); };
      document.getElementById("customModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("customModal").style.display = "none";
    }

    function deactivateUser(userId) {
      showConfirm("Are you sure you want to deactivate this user?", () => {
        fetch(`/api/users/${userId}/deactivate`, { 
          method: "PUT",
          headers: {
            "Authorization": "Bearer " + localStorage.getItem("authToken")
          }
        })          .then(res => res.json())
          .then(data => {
            showAlert(data.message, data.success ? "success" : "error");
            loadUsers();
          });
      });
    }

    function reactivateUser(userId) {
      showConfirm("Are you sure you want to reactivate this user?", () => {
        fetch(`/api/users/${userId}/reactivate`, { 
          method: "PUT",
          headers: {
            "Authorization": "Bearer " + localStorage.getItem("authToken")
          }
        })
          .then(res => res.json())
          .then(data => {
            showAlert(data.message, data.success ? "success" : "error");
            loadUsers();
          });
      });
    }
  </script>

<!-- Custom Modal -->
<div id="customModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.3); z-index:9999; align-items:center; justify-content:center;">
  <div style="background:#fff; border-radius:16px; padding:32px; width:380px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.15);">
    <div id="modalIcon" style="font-size:40px; margin-bottom:12px;"></div>
    <h3 id="modalTitle" style="margin:0 0 8px; font-size:20px; color:#111827;"></h3>
    <p id="modalMessage" style="color:#6b7280; font-size:14px; margin:0 0 24px;"></p>
    <div id="modalButtons" style="display:flex; gap:12px; justify-content:center;"></div>
  </div>
</div>

</body>
</html>
